<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EIGHT TEEN v2">
<title>EIGHT TEEN v2</title>
<link rel="icon" href="../icons/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Tokens follow the EIGHT TEEN v1.7 light theme (Figma et-color). */
:root{
  --page-bg:#e8e5f2; --frame:#0b1026;
  --canvas:#ffffff; --surface:#f3f3f6; --sunken:#eaeaef; --ink:#0b1026; --ink2:#545871; --muted:#5f6378; --tert:#8b8ea3;
  --border:#e3e1ea; --divider:#eceaf2; --brand:#7c3aed; --brand-ink:#5b21b6; --info:#f4f1fd;
  --lime:#c6f43b; --danger:#c42b31; --danger-bg:#fdecec; --warn-bg:#fff4d6; --warn:#8a5a00;
  --nav:rgba(255,255,255,.88); --scrim:rgba(11,16,38,.45);
  --peach-bg:#ffe7d6; --mango-bg:#ffe39a; --mango:#ffc53d;
  --map-ground:#eef0e7; --map-road:#ffffff; --map-green:#cfe6b4; --map-bldg:#dedbe8; --map-water:#c3e2f2; --map-label:#5f6378;
  --f-d:'Anuphan','Noto Sans Thai',system-ui,sans-serif;
  --f-b:'Noto Sans Thai','Plus Jakarta Sans',system-ui,sans-serif;
  --f-n:'Plus Jakarta Sans','Noto Sans Thai',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --tb:88px; /* space kept for the floating tab bar */
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--page-bg);color:var(--ink);font:400 15px/1.55 var(--f-b);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
img{display:block}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px} svg.i.xs{width:15px;height:15px} svg.i.lg{width:28px;height:28px}
#app{position:fixed;inset:0;margin:0 auto;max-width:440px;background:var(--canvas);overflow:hidden}
@media (min-width:620px){#app{width:390px;height:min(844px,calc(100vh - 48px));inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:54px;box-shadow:0 0 0 11px var(--frame),0 30px 80px rgba(11,16,38,.3)}}
.scr{position:absolute;inset:0;padding-top:var(--st);display:flex;flex-direction:column}
/* type + buttons (v1.7) */
.display{font:700 30px/38px var(--f-d);letter-spacing:-.6px;text-wrap:balance;margin:0}
.h1{font:700 24px/32px var(--f-d);margin:0}
.h2{font:700 18px/26px var(--f-d);margin:0}
.cap{font-size:12px;line-height:18px;color:var(--muted)}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.hl{background:var(--lime);color:#0b1026;padding:0 10px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:999px;font:700 17px/1 var(--f-d);transition:transform .12s,box-shadow .12s}
.btn.block{width:100%}
.btn.primary{background:var(--brand);color:#fff;box-shadow:4px 4px 0 var(--lime)}
.btn.primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--lime)}
.btn.soft{background:var(--surface)}
.btn.sm{min-height:44px;padding:0 18px;font-size:14px}
.iconbtn{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--ink);flex:none}
.iconbtn.w{background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(11,16,38,.12)}
.chip{flex:none;min-height:32px;padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:var(--canvas);font:600 13px/1.2 var(--f-b);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.chip.brand{background:var(--info);border-color:#e4dafc;color:var(--brand-ink)}
.verified{display:inline-flex;color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* ---------- header (v1.7 home) ---------- */
.hdr{padding:6px 20px 0;flex:none}
.hdr-row{display:flex;align-items:center;gap:10px}
.uni{font:700 30px/38px var(--f-d);display:flex;align-items:center;gap:6px;flex:1}
.feedtabs{display:flex;gap:22px;margin-top:4px;border-bottom:1px solid var(--divider);align-items:center}
.feedtab{font:700 17px/1 var(--f-d);color:var(--tert);padding:10px 0 12px;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.feedtab.on{color:var(--ink);border-color:var(--brand)}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px;margin-left:auto}
.seg button{padding:6px 12px;border-radius:999px;font:700 13px/1 var(--f-b);color:var(--ink2)}
.seg button.on{background:var(--canvas);color:var(--ink);box-shadow:0 1px 3px rgba(11,16,38,.12)}
.pstrip{margin:10px 12px 10px;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-radius:18px;background:var(--info);border:1px solid #e4dafc;text-align:left;width:calc(100% - 24px);flex:none}
.pstrip .e{font-size:24px;flex:none}
.pstrip .t{flex:1;min-width:0}
.pstrip small{display:block;font:800 10.5px/1.3 var(--f-n);letter-spacing:.04em;color:var(--brand)}
.pstrip b{display:block;font:700 14.5px/1.35 var(--f-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstrip .go{flex:none;background:var(--brand);color:#fff;border-radius:99px;padding:9px 14px;font:700 13px/1 var(--f-d);box-shadow:2px 2px 0 var(--lime)}
/* ---------- tab bar + FAB (v1.7) ---------- */
.tabbar{position:absolute;left:16px;right:16px;bottom:calc(12px + var(--sb));height:64px;border-radius:999px;background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(11,16,38,.06),0 12px 32px rgba(11,16,38,.14);display:grid;grid-template-columns:repeat(3,1fr);align-items:center;z-index:30;padding:0 8px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:600 12px/1.3 var(--f-b);color:var(--ink2);min-height:52px;margin:0 6px;border-radius:999px;position:relative}
.tab.on{color:var(--ink);background:var(--surface)}
.tab .dot{position:absolute;top:3px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:#d1242f;color:#fff;font:800 11px/18px var(--f-n);text-align:center;padding:0 5px}
.fab{position:absolute;right:18px;bottom:calc(92px + var(--sb));width:58px;height:58px;border-radius:20px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 var(--lime),0 10px 24px rgba(124,58,237,.35);z-index:31}
.fab svg.i{width:28px;height:28px;stroke-width:2.4}
/* ---------- feed (swipe cards) ---------- */
#feed{flex:1;min-height:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 12px calc(var(--tb) + var(--sb));touch-action:pan-y}
.card{position:relative;height:100%;border-radius:26px;overflow:hidden;background:#111}
.fr{position:absolute;inset:0;overflow:hidden;background:#111}
.fr .blur{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(26px) brightness(.7) saturate(1.2)}
.fr .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fr .gf{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);width:100%;max-height:66%;object-fit:contain}
.fr .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,38,.2) 0,transparent 18%,transparent 58%,rgba(11,16,38,.7) 100%);pointer-events:none}
.fr[data-kind=voice] .shade{display:none}
.gifb{position:absolute;left:14px;top:14px;font:800 11px/1 var(--f-n);letter-spacing:.06em;background:rgba(11,16,38,.6);color:#fff;padding:5px 7px;border-radius:7px}
/* voice card: light brand tint + v1.7 player */
.vbg{position:absolute;inset:0}
.deco{position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;box-shadow:10px 10px 0 var(--lime)}
.deco2{position:absolute;right:120px;top:30px;width:24px;height:24px;border-radius:7px;transform:rotate(18deg)}
.vwrap{position:absolute;left:20px;right:72px;top:20%;bottom:150px;display:flex;flex-direction:column;justify-content:center;gap:16px;color:var(--ink)}
.vtag{display:flex;gap:6px;flex-wrap:wrap}
.caption{font:700 25px/1.45 var(--f-d);letter-spacing:-.2px;word-break:break-word}
.caption.sm{font-size:21px}
.caption .w{color:rgba(11,16,38,.25);transition:color .12s;border-radius:6px}
.caption .w.on{color:var(--ink)}
.caption .w.cur{background:var(--lime);box-shadow:0 0 0 3px var(--lime)}
.caption.na{font:500 14px/1.5 var(--f-b);color:var(--ink2);display:flex;gap:8px}
.player{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.8);border-radius:999px;padding:6px 6px 6px 6px}
.pbtn{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.wave{display:flex;align-items:center;gap:2.5px;height:26px;flex:1;min-width:0;overflow:hidden}
.wave i{display:block;width:3px;border-radius:2px;background:#cdbcf8;height:var(--h,10px);flex:none}
.wave i.on{background:var(--brand)}
.spd{font:800 12.5px/1 var(--f-n);min-width:40px;height:30px;border-radius:99px;background:var(--canvas);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none}
.snd{width:30px;height:30px;border-radius:50%;background:var(--canvas);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none}
.tm{font:700 12px/1 var(--f-n);color:var(--ink2);flex:none;min-width:28px}
.needtap .pbtn{animation:nudge 1.2s infinite}
@keyframes nudge{50%{box-shadow:0 0 0 8px rgba(124,58,237,.18)}}
/* stickers */
.stk{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));max-width:84%;padding:8px 14px;border-radius:14px;font:700 18px/1.35 var(--f-d);text-align:center;box-shadow:0 6px 18px rgba(11,16,38,.18);word-break:break-word}
.stk.prompt{font:700 14.5px/1.35 var(--f-d);border-radius:18px;padding:10px 14px;background:#fff;color:var(--ink);display:flex;gap:8px;align-items:center;text-align:left;box-shadow:4px 4px 0 var(--lime),0 6px 18px rgba(11,16,38,.12)}
.stk.prompt small{display:block;font:800 10px/1.2 var(--f-n);letter-spacing:.04em;color:var(--brand)}
.stk.blurbox{width:var(--w,120px);height:var(--w,120px);border-radius:50%;padding:0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(255,255,255,.08);box-shadow:none;border:1.5px dashed rgba(255,255,255,.75)}
.fr.final .stk.blurbox{border:0}
.editing .stk{cursor:grab;touch-action:none}
/* rail + info on cards */
.rail{position:absolute;right:10px;bottom:96px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:3}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px/1 var(--f-n);color:#fff;text-shadow:0 1px 2px rgba(11,16,38,.8),0 0 8px rgba(11,16,38,.55);width:52px}
.lt .rb{color:var(--ink);text-shadow:none}
.rb .o{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 4px 14px rgba(11,16,38,.14)}
.rb .o svg.i{width:23px;height:23px}
.rb.on .o{background:var(--brand);color:#fff;box-shadow:3px 3px 0 var(--lime)}
.info{position:absolute;left:14px;right:74px;bottom:14px;z-index:3;display:flex;flex-direction:column;gap:9px;color:#fff}
.lt .info{color:var(--ink)}
.who{display:flex;align-items:center;gap:10px;text-shadow:0 1px 3px rgba(11,16,38,.35)}
.lt .who{text-shadow:none}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;box-shadow:0 0 0 2px #fff}
.av.sm{width:26px;height:26px;font-size:14px}
.who b{font:700 15px/1.25 var(--f-d);display:block}
.who span{font:500 12.5px/1.3 var(--f-b);opacity:.92}
.badge{font:800 10px/1 var(--f-n);background:var(--lime);color:#0b1026;border-radius:6px;padding:3px 6px;margin-left:6px;vertical-align:2px;text-shadow:none}
.rhint{display:flex;align-items:center;gap:8px;align-self:flex-start;height:38px;padding:0 10px 0 6px;border-radius:99px;background:rgba(255,255,255,.96);color:var(--ink);font:600 13px/1 var(--f-b);box-shadow:0 4px 14px rgba(11,16,38,.12)}
.rhint .avs{display:flex}.rhint .avs .av{margin-left:-8px}.rhint .avs .av:first-child{margin-left:0}
.burst{position:absolute;font-size:90px;pointer-events:none;z-index:9;animation:burst .8s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
/* ---------- generic ---------- */
.toast{position:absolute;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:11px 16px;font:600 14px/1.35 var(--f-b);z-index:80;box-shadow:0 10px 30px rgba(11,16,38,.3);display:flex;gap:12px;align-items:center;max-width:92%;animation:tin .25s ease-out}
.toast button{font-weight:800;color:var(--lime);white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
.sheetw{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.sheetw .bd{position:absolute;inset:0;background:var(--scrim);animation:fd .2s}
.sheet{position:relative;background:var(--canvas);border-radius:28px 28px 0 0;padding:10px 20px calc(var(--sb) + 20px);max-height:88%;overflow:auto;animation:su .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--sunken);margin:0 auto 14px}
.sheet p.sub{margin:4px 0 14px;color:var(--ink2);font-size:14px}
@keyframes su{from{transform:translateY(100%)}} @keyframes fd{from{opacity:0}}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--divider);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:600 15px/1.35 var(--f-b)}
.row .t span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tg{width:50px;height:30px;border-radius:99px;background:var(--sunken);position:relative;flex:none;transition:.2s}
.tg:after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(11,16,38,.2)}
.tg.on{background:var(--brand)}.tg.on:after{left:23px}
.pick{min-height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--border);font:600 14px/1 var(--f-b);display:inline-flex;align-items:center;gap:6px}
.pick.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{font-size:13.5px;color:var(--ink2);background:var(--info);border-radius:16px;padding:12px 14px;display:flex;gap:10px;line-height:1.5}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
/* ---------- stack viewer ---------- */
.sv{position:absolute;inset:0;z-index:40;background:var(--canvas);display:flex;flex-direction:column;padding-top:var(--st);animation:svin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes svin{from{transform:translateX(100%)}}
.sv.closing{transition:transform .25s,opacity .25s;transform:translateY(40%);opacity:0}
.sv-top{padding:10px 14px 10px;flex:none}
.bars{display:flex;gap:4px;margin-bottom:12px}
.bars i{flex:1;height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--brand)}
.bars i.done b{width:100%}
.sv-who{display:flex;align-items:center;gap:10px}
.sv-who .av{box-shadow:none}
.sv-who .t{flex:1;min-width:0}
.sv-who .t b{font:700 15px/1.25 var(--f-d);display:block}
.sv-who .t span{font:500 12.5px/1.3 var(--f-b);color:var(--muted)}
.sv-ctx{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;padding:6px 12px 6px 8px;border-radius:12px;background:var(--info);color:var(--brand-ink);font:700 13px/1.35 var(--f-d);max-width:100%}
.sv-stage{position:relative;flex:1;min-height:0;margin:0 12px;border-radius:26px;overflow:hidden;touch-action:none;background:#111}
.sv-stage .vwrap{right:20px}
.sv-end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;background:var(--info);color:var(--ink)}
.tile{width:110px;height:110px;border-radius:30px;background:var(--brand);box-shadow:8px 8px 0 var(--lime);display:flex;align-items:center;justify-content:center;font-size:50px;transform:rotate(-4deg);margin-bottom:12px;flex:none}
.sv-end p{margin:0;color:var(--ink2)}
.sv-ate{position:absolute;right:10px;bottom:14px;z-index:4}
.rbar{display:flex;align-items:center;gap:8px;padding:12px 14px calc(var(--sb) + 14px);flex:none}
.talk{flex:1;height:54px;border-radius:999px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:0 6px 0 18px;font:700 16px/1 var(--f-d);touch-action:none;box-shadow:4px 4px 0 var(--lime);margin-right:4px}
.talk .lbl{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:7px;pointer-events:none;white-space:nowrap}
.talk .fx{height:42px;border-radius:21px;background:rgba(255,255,255,.2);padding:0 12px;display:flex;align-items:center;gap:5px;font:600 13px/1 var(--f-b)}
.recov{position:absolute;inset:0;z-index:70;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:30px 24px calc(var(--sb) + 44px);gap:18px;text-align:center;pointer-events:none}
.recov .live{font:700 23px/1.45 var(--f-d);min-height:100px;display:flex;align-items:flex-end;justify-content:center}
.recov .live.ph{color:var(--tert);font:500 16px/1.5 var(--f-b)}
.rtm{font:800 15px/1 var(--f-n);display:flex;align-items:center;gap:8px}
.rtm:before{content:'';width:10px;height:10px;border-radius:50%;background:#e5484d;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.orb{width:116px;height:116px;border-radius:36px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:6px 6px 0 var(--lime);animation:pulse 1.2s infinite}
.orb svg.i{width:44px;height:44px}
@keyframes pulse{50%{transform:scale(1.06) rotate(-3deg)}}
.recov.cancel .orb{background:var(--danger);box-shadow:6px 6px 0 #ffb3b6;animation:none}
.recov .hint{font:600 13px/1.3 var(--f-b);color:var(--ink2);display:flex;align-items:center;gap:6px}
/* ---------- composer ---------- */
.cmp{position:absolute;inset:0;z-index:50;background:var(--canvas);display:flex;flex-direction:column;padding-top:var(--st);animation:fd .2s}
.cmp-stage{position:relative;flex:1;min-height:0;margin:8px 12px 0;border-radius:26px;overflow:hidden;background:#111}
.cmp-stage.lightst{background:var(--surface)}
.cmp-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp-stage video.mir{transform:scaleX(-1)}

/* aliases: a new random name per post, unique inside that post */
function aliasMap(post){
 const m={},used=new Set();
 [post.by,...post.replies.map(r=>r.by)].forEach(u=>{if(m[u])return;let h=hash(post.id+'|'+u),k=0,a;
  do{a=[h%ANIMALS.length,(h>>>8)%COLORS.length];h=hash(h+':'+(++k))}while(used.has(a.join())&&k<50);used.add(a.join());
  m[u]={e:ANIMALS[a[0]][0],n:ANIMALS[a[0]][1]+COLORS[a[1]][0],c:COLORS[a[1]][1]}});
 return m;
}

/* captions: Thai-aware word split, timed by length */
const seg=window.Intl&&Intl.Segmenter?new Intl.Segmenter('th',{granularity:'word'}):null;
function capHTML(text,dur){
 if(!text) return `<div class="caption na">${I('cc','sm')} ยังไม่มีคำบรรยาย · ในแอปจริงระบบจะถอดเสียงให้ทุกคลิป</div>`;
 const parts=seg?[...seg.segment(text)].map(s=>s.segment):text.split(/(\s+)/);
 const total=parts.reduce((a,p)=>a+p.trim().length,0)||1; let acc=0;
 const lead=Math.min(.3,dur*.04), span=dur*.92-lead;
 return `<div class="caption${text.length>70?' sm':''}">`+parts.map(p=>{const t=lead+span*acc/total;acc+=p.trim().length;return p.trim()?`<span class="w" data-t="${t.toFixed(2)}">${esc(p)}</span>`:esc(p)}).join('')+'</div>';
}

let active=null, raf=0;

/* feed: play the card on screen, swipe left = replies, double tap = ATE */
let io=null;

 $$('.slide',f).forEach(s=>io.observe(s));

 f.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=Date.now()});
 f.addEventListener('pointerup',e=>{
  if(e.target.closest('button'))return;
  const dx=e.clientX-sx,dy=e.clientY-sy,sl=e.target.closest('.slide');if(!sl)return;
  if(dx<-60&&Math.abs(dx)>Math.abs(dy)*1.4){openStack(sl.dataset.pid);return}

/* ============ recording, transcript, voice filters ============ */
const Rec={
 async start(onText){
  this.text=''; this.chunks=[];
  this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  this.mr=new MediaRecorder(this.stream,mt?{mimeType:mt}:undefined);
  this.mr.ondataavailable=e=>{if(e.data&&e.data.size)this.chunks.push(e.data)};
  this.mr.start(250); this.t0=Date.now();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; this.srOk=false; this.sr=null;
  if(SR){try{const r=new SR();r.lang='th-TH';r.continuous=true;r.interimResults=true;let fin='';
   r.onresult=e=>{let im='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript+' ';else im+=x[0].transcript}this.text=(fin+im).trim();onText&&onText(this.text)};
   r.onerror=()=>{};r.start();this.sr=r;this.srOk=true}catch(e){}}
 },
 stop(){return new Promise(res=>{const mr=this.mr;if(!mr||mr.state==='inactive'){res(null);return}
  mr.onstop=()=>{const blob=new Blob(this.chunks,{type:mr.mimeType||'audio/webm'});this.stream.getTracks().forEach(t=>t.stop());const dur=(Date.now()-this.t0)/1000;
   setTimeout(()=>{try{this.sr&&this.sr.stop()}catch(e){}res({blob,dur,text:this.text.trim(),srOk:this.srOk})},450)};mr.stop()})},
 cancel(){try{this.sr&&this.sr.abort()}catch(e){}try{this.mr&&this.mr.state!=='inactive'&&this.mr.stop()}catch(e){}this.stream&&this.stream.getTracks().forEach(t=>t.stop());this.mr=null}
};
let ACX; const actx=()=>ACX||(ACX=new (window.AudioContext||window.webkitAudioContext)());
async function decodePCM(blob){
 const ab=await blob.arrayBuffer(); const buf=await new Promise((res,rej)=>{const p=actx().decodeAudioData(ab,res,rej);p&&p.catch&&p.catch(rej)});
 const n=buf.length,ch=buf.numberOfChannels,m=new Float32Array(n);for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)m[i]+=d[i]/ch}
 const sr=22050,ratio=buf.sampleRate/sr,len=Math.floor(n/ratio),out=new Float32Array(len);
 for(let i=0;i<len;i++){const x=i*ratio,j=Math.floor(x),f=x-j;out[i]=m[j]*(1-f)+(m[j+1]||0)*f}
 return {pcm:out,sr};
}
function applyFx(x,sr,f){
 let y=x;
 if(f.p!==1){const w=Math.floor(sr*.05),o=new Float32Array(x.length),k=1-f.p;
  for(let i=0;i<x.length;i++){const d=((i*k)%w+w)%w,d2=(d+w/2)%w,g=Math.sin(Math.PI*d/w)**2,g2=1-g,i1=i-Math.floor(d),i2=i-Math.floor(d2);o[i]=(i1>=0?x[i1]:0)*g+(i2>=0?x[i2]:0)*g2}y=o}
 if(f.ring){const o=new Float32Array(y.length),w=2*Math.PI*f.ring/sr;for(let i=0;i<y.length;i++)o[i]=y[i]*(.35+.65*Math.sin(w*i));y=o}
 if(f.radio){const o=new Float32Array(y.length);let hp=0,lp=0,px=0;const a1=Math.exp(-2*Math.PI*450/sr),a2=Math.exp(-2*Math.PI*2800/sr);
  for(let i=0;i<y.length;i++){hp=a1*(hp+y[i]-px);px=y[i];lp=lp*a2+hp*(1-a2);o[i]=Math.tanh(lp*4)/Math.tanh(4)+(Math.random()-.5)*.012}y=o}

}
function wavBlob(x,sr){
 const b=new ArrayBuffer(44+x.length*2),v=new DataView(b),W=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 W(0,'RIFF');v.setUint32(4,36+x.length*2,true);W(8,'WAVE');W(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);W(36,'data');v.setUint32(40,x.length*2,true);
 for(let i=0;i<x.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,x[i]))*0x7fff,true);

}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const noSR='ถอดเสียงอัตโนมัติไม่ทำงานในเบราว์เซอร์นี้ (ลอง Chrome หรือ Safari) · ในแอปจริงระบบถอดเสียงให้ทุกคลิป';

/* walkie-talkie: hold to talk, slide up to cancel, release to send */
function recOverlay(){const o=document.createElement('div');o.className='recov';o.innerHTML=`<div class="live ph">กำลังฟัง… คำพูดของคุณจะขึ้นเป็นคำบรรยายตรงนี้</div><div class="rtm">0:00</div><div class="orb">${I('mic')}</div><div class="hint">${I('up','xs')} เลื่อนขึ้นเพื่อยกเลิก · ปล่อยเพื่อส่ง</div><div class="hint">${fx(S.filter).e} ส่งด้วยเสียง “${fx(S.filter).n}”</div>`;app.appendChild(o);return o}
function bindTalk(btn){

 btn.addEventListener('pointerdown',async e=>{if(e.target.closest('.fx'))return;e.preventDefault();btn.setPointerCapture&&btn.setPointerCapture(e.pointerId);
  on=true;cancel=false;released=false;ready=false;sy=e.clientY;stopActive();
  ov=recOverlay();t0=Date.now();tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);const t=ov&&$('.rtm',ov);if(t)t.textContent=mmss(s);if(s>=60)finish()},250);
  try{await Rec.start(t=>{const l=ov&&$('.live',ov);if(l){l.classList.remove('ph');l.textContent=t}});ready=true;if(released)finish()}
  catch(err){clearInterval(tick);ov&&ov.remove();ov=null;on=false;toast('ต้องอนุญาตไมโครโฟนก่อน แล้วกดค้างอีกครั้ง')}
 });
 btn.addEventListener('pointermove',e=>{if(!on||!ov)return;cancel=sy-e.clientY>80;ov.classList.toggle('cancel',cancel)});

 btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',()=>{cancel=true;up()});
 async function finish(){if(!on)return;on=false;clearInterval(tick);const o=ov;ov=null;
  if(cancel){Rec.cancel();o&&o.remove();toast('ยกเลิกแล้ว');renderStack();return}
  const r=await Rec.stop();o&&o.remove();
  if(!r||r.dur<0.7){toast('กดค้างไว้แล้วพูด ปล่อยเมื่อพูดจบ');renderStack();return}
  toast('กำลังใส่ฟิลเตอร์เสียง…');
  try{const {pcm,sr}=await decodePCM(r.blob);const out=applyFx(pcm,sr,fx(S.filter));const url=await blobToData(wavBlob(out,sr));
   addReply(SV.pid,{kind:'voice',dataURL:url,dur:out.length/sr,text:r.text,filter:S.filter,bg:Math.floor(Math.random()*BG.length)});
  }catch(err){toast('ประมวลผลเสียงไม่ได้ในเบราว์เซอร์นี้');renderStack()}
 }
}

function snap(){

function fileToPhoto(file){const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1280/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);toEdit({kind:'photo',src:c.toDataURL('image/jpeg',.82)})};img.src=URL.createObjectURL(file)}

/* draggable stickers + trash */
function bindStickers(stage){
 let drag=null;
 stage.addEventListener('pointerdown',e=>{const s=e.target.closest('.stk');if(!s)return;e.preventDefault();const r=stage.getBoundingClientRect();drag={el:s,i:+s.dataset.si,r,moved:false,sx:e.clientX,sy:e.clientY};s.setPointerCapture&&s.setPointerCapture(e.pointerId)});
 stage.addEventListener('pointermove',e=>{if(!drag)return;const {r,el}=drag;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6){drag.moved=true;stage.classList.add('dragging')}if(!drag.moved)return;
  const x=Math.min(.95,Math.max(.05,(e.clientX-r.left)/r.width)),y=Math.min(.97,Math.max(.03,(e.clientY-r.top)/r.height));el.style.left=x*100+'%';el.style.top=y*100+'%';drag.x=x;drag.y=y;
  const t=$('#trash',stage).getBoundingClientRect();drag.del=e.clientY>t.top-20&&Math.abs(e.clientX-(t.left+t.width/2))<70;$('#trash',stage).classList.toggle('hot',drag.del)});
 const end=()=>{if(!drag)return;const d=drag;drag=null;stage.classList.remove('dragging');const s=C.stickers[d.i];
  if(!d.moved){if(s.t==='text')textEditor(d.i);else if(s.t==='blur'){s.w=s.w>=200?90:(s.w||120)+40;renderComposer()}return}
  if(d.del){C.stickers.splice(d.i,1);renderComposer();return} s.x=d.x;s.y=d.y};
 stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
}

 o.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div class="dots" style="justify-content:flex-start">${STK.map((c,k)=>`<button data-c="${k}" class="${s.c===k?'on':''}" style="background:${c.bg}"></button>`).join('')}</div><button class="btn primary sm" id="txdone">เสร็จ</button></div><textarea maxlength="80" placeholder="พิมพ์ข้อความสั้นๆ">${esc(s.s)}</textarea>`;

}

  {a:`<div class="bigtile list"><div>${avHTML({e:'🦊',c:'#ffd2b3'})} จิ้งจอกส้ม</div><div>${avHTML({e:'🐙',c:'#c9f2ea'})} หมึกมิ้นต์</div><div>${avHTML({e:'🦉',c:'#ffd3e7'})} นกฮูกชมพู</div></div>`,h:'<span class="hl">ชื่อเล่นใหม่</span><br>ทุกโพสต์',p:'สามชื่อนี้อาจเป็นคนเดียวกัน ไม่มีใครโยงโพสต์ของคุณเข้าด้วยกันได้ และหน้า “ฉัน” มีแค่คุณที่เห็น'},
  {a:`<div class="bigtile">🎙️</div>`,h:'เสียงของคุณ<br>แต่<span class="hl">ไม่มีใครจำได้</span>',p:'ใส่ฟิลเตอร์ปลอมเสียงได้ ทุกคลิปมีคำบรรยาย เปิดเสียงไม่ได้ก็อ่านได้ หรือฟัง 2× ก็ได้'}];
 const x=P[k]; $$('.intro').forEach(i=>i.remove()); const el=document.createElement('div');el.className='intro';
 el.innerHTML=`<div style="display:flex;justify-content:flex-end"><button class="btn soft sm" id="inskip" style="min-height:36px">ข้าม</button></div><div class="art">${x.a}</div><h1 class="display">${x.h}</h1><p>${x.p}</p><div class="idots">${P.map((_,i)=>`<i class="${i===k?'on':''}"></i>`).join('')}</div><button class="btn primary block" id="inx">${k<2?'ต่อไป':'เริ่มเลย'}</button>`;
 app.appendChild(el);
 const done=()=>{el.remove();S.intro=true;save();log('intro_done');render()};
 $('#inx',el).onclick=()=>{if(k<2)intro(k+1);else done()}; $('#inskip',el).onclick=done;
}

/* ============ actions ============ */
const A={
 tab(t){S.tab=t;save();render()},
 view(v){S.view=v;save();render()},
 sort(s){S.sort=s;save();render()},
 sound(){S.sound=!S.sound;save();log('sound_toggled',{on:S.sound});applyAudioPrefs()},
 speed(){S.rate=S.rate===1?1.5:S.rate===1.5?2:1;save();log('speed_changed',{rate:S.rate});applyAudioPrefs()},
 speedRow(){A.speed();render()},
 playpause(){togglePlay()},
 ate(arg,el,e){const [pid,rid]=arg.split('|');doAte(pid,false,e,rid)},
 openStack(pid){openStack(pid)},
 closeStack(){closeStack()},
 svRestart(){SV.i=0;renderStack()},
 svToReplies(){const items=svItems();const it=items[Math.min(SV.i,items.length-1)];openStack(it.id)},
 replyPhoto(){const pid=SV.pid;stopActive();openComposer({mode:'photo',target:pid})},
 replyGif(){const pid=SV.pid;sheet(`<h2 class="h1">ตอบด้วย GIF</h2><p class="sub">แตะเพื่อส่งทันที</p><div class="grid g">${GIFS.map(x=>`<button style="background-image:url('../img/gif/${x[0]}.gif')" data-act="sendGif" data-arg="${pid}|../img/gif/${x[0]}.gif"></button>`).join('')}</div>`)},
 sendGif(arg){const [pid,src]=arg.split('|');closeSheet();addReply(pid,{kind:'gif',src})},
 pickFx(){sheet(`<h2 class="h1">ฟิลเตอร์เสียง</h2><p class="sub">ใช้กับคลิปเสียงที่คุณส่ง ทั้งโพสต์และคำตอบ</p>${FX.map(f=>`<button class="row" data-act="setDefFx" data-arg="${f.id}"><span style="font-size:26px">${f.e}</span><span class="t"><b>${f.n}${f.id==='mask'?' · แนะนำ':''}</b><span>${f.d}</span></span>${S.filter===f.id?`<span style="color:var(--brand)">${I('check')}</span>`:''}</button>`).join('')}`)},
 setDefFx(id){S.filter=id;save();log('filter_default',{id});closeSheet();if(SV)renderStack();else if(!C)render(true)},
 more(pid){sheet(`<h2 class="h1">โพสต์นี้</h2><button class="row" data-act="hide" data-arg="${pid}"><span class="t"><b>ไม่อยากเห็นโพสต์นี้</b><span>ซ่อนจากฟีดของคุณเท่านั้น</span></span></button><button class="row" data-act="report" data-arg="${pid}"><span class="t"><b style="color:var(--danger)">รายงาน</b><span>กลั่นแกล้ง เปิดเผยตัวตนคนอื่น เนื้อหาไม่เหมาะสม</span></span></button>`)},
 hide(){closeSheet();toast('ซ่อนแล้ว')},
 report(){closeSheet();sheet(`<h2 class="h1">รายงานโพสต์</h2><p class="sub">ทีมงานตรวจภายใน 24 ชม. เจ้าของโพสต์ไม่รู้ว่าใครรายงาน</p>${['กลั่นแกล้ง / บูลลี่','มีหน้าหรือข้อมูลของคนอื่นโดยไม่ยินยอม','เนื้อหาทางเพศ / ความรุนแรง','สแปม'].map(r=>`<button class="row" data-act="reportDone"><span class="t"><b>${r}</b></span>${I('chev','sm')}</button>`).join('')}`)},
 reportDone(){closeSheet();log('report');toast('ส่งรายงานแล้ว ขอบคุณที่ช่วยดูแล')},
 openPlace(id){if(!S.seenPlaces.includes(id)){S.seenPlaces.push(id);save()}log('place_opened',{id});
  showStack({mode:'place',place:id,items:()=>S.posts.filter(p=>p.place===id).sort((a,b)=>b.at-a.at)})},
 openPrompt(){log('prompt_opened');showStack({mode:'prompt',items:()=>S.posts.filter(p=>p.prompt).sort((a,b)=>b.at-a.at)})},
 openPromptCompose(){if(SV){const el=SV.el;stopActive();SV=null;el.remove()}openComposer({mode:'voice',prompt:true})},
 composePlace(){const id=SV.place;const el=SV.el;stopActive();SV=null;el.remove();openComposer({mode:'photo',place:id})},
 openMine(pid){openStack(pid,0)},
 openNotif(id){const n=S.notifs.find(x=>x.id===id);n.read=true;save();
  if(n.kind==='prompt')A.openPrompt();else if(n.kind==='place')A.openPlace(n.place);else if(n.pid){const p=postById(n.pid);openStack(n.pid,n.kind==='reply'?p.replies.length:1)}},
 compose(){openComposer({mode:'photo'})},
 closeCmp(){closeComposer()},
 cmode(m){if(C.recording)return;C.mode=m;renderComposer()},
 gallery(){const f=$('#filein');f.value='';f.onchange=()=>{if(f.files[0])fileToPhoto(f.files[0])};f.click()},
 sample(src){toEdit({kind:'photo',src})},
 snap(){snap()},
 flip(){C.facing=C.facing==='user'?'environment':'user';startCam()},
 pickGif(src){toEdit({kind:'gif',src})},
 vrec(){voiceToggle()},
 cmpBack(){stopActive();C.live='';C.step='capture';C.media=null;C.stickers=C.prompt?[promptStk()]:[];renderComposer()},
 addText(){textEditor(null)},
 addBlur(){C.faceSeen=true;C.stickers.push({t:'blur',x:.5,y:.45,w:120});renderComposer();toast('ลากไปวางบนหน้า แตะเพื่อขยาย ลากลงถังขยะเพื่อลบ')},
 faceOk(){C.faceSeen=true;renderComposer()},
 setFx(id){C.filter=id;stopActive();renderFx();renderComposer()},
 setBg(k){C.bg=+k;renderComposer()},
 placeSheet(){sheet(`<h2 class="h1">ติดสถานที่</h2><p class="sub">โพสต์จะขึ้นในบับเบิลของที่นั้น 72 ชม. ไม่แชร์ตำแหน่งของคุณ</p><div class="chips"><button class="pick ${!C.place?'on':''}" data-act="setPlace" data-arg="">ไม่ใส่</button>${PLACES.map(p=>`<button class="pick ${C.place===p.id?'on':''}" data-act="setPlace" data-arg="${p.id}">${esc(p.n)}</button>`).join('')}</div>`)},
 setPlace(id){C.place=id||null;closeSheet();if(C.step==='edit')renderComposer()},
 postSheet(){stopActive();postSheet()},
 doPost(){doPost()},
 sendReply(){sendReply()},
 closeSheet(){closeSheet()},
 tgl(k){S[k]=!S[k];save();if(k==='sound')applyAudioPrefs();render()},
 testlog(){const posts=S.log.filter(l=>l.e==='post_created'),reps=S.log.filter(l=>l.e==='reply_created');const first=[...posts,...reps].sort((a,b)=>a.t-b.t)[0];
  const cnt=k=>S.log.filter(l=>l.e===k).length;
  sheet(`<h2 class="h1">ผลการทดสอบในเครื่องนี้</h2><p class="sub">เก็บไว้ในเครื่องนี้เท่านั้น</p><div class="stats" style="margin:0 0 12px"><div><b>${posts.length}</b><span>โพสต์</span></div><div><b>${reps.length}</b><span>คำตอบ</span></div><div><b>${first?Math.round((first.t-S.t0)/1000)+'s':'–'}</b><span>ถึงโพสต์แรก</span></div></div>
  <div class="mono">เปิดคำตอบ ${cnt('replies_opened')} · เปิดบับเบิล ${cnt('place_opened')} · เปิดคำถามวันนี้ ${cnt('prompt_opened')}\nเปิด/ปิดเสียง ${cnt('sound_toggled')} · เปลี่ยนความเร็ว ${cnt('speed_changed')} · ATE ${cnt('ate')}\n\n${S.log.slice(0,25).map(l=>new Date(l.t).toLocaleTimeString('th-TH')+'  '+l.e+' '+JSON.stringify(l.p)).join('\n')}</div>`)},
 replayIntro(){intro(0)},
 reset(){if(!confirm('ล้างข้อมูลต้นแบบทั้งหมดในเครื่องนี้?'))return;try{localStorage.removeItem(KEY);indexedDB.deleteDatabase('et18v2')}catch(e){}location.reload()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!app.contains(b))return;const a=A[b.dataset.act];if(a){e.stopPropagation();a(b.dataset.arg,b,e)}});

/* ============ boot ============ */
(async()=>{
 const keys=[];S.posts.forEach(p=>{p.key&&keys.push(p.key);p.replies.forEach(r=>r.key&&keys.push(r.key))});
 await Promise.all(keys.map(async k=>{MEM[k]=await idb.get(k)}));
 render(); if(!S.intro)intro(0);
})();
</script>
