<title>EIGHT TEEN Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: phone frame (390×844, Figma v0.2) beside a prototype control panel; phone fills the screen on mobile. */
:root{
  --ts:1;
  --f-display:'Anuphan','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Noto Sans Thai','Plus Jakarta Sans',system-ui,sans-serif;
  --f-num:'Plus Jakarta Sans','Noto Sans Thai',system-ui,sans-serif;
  /* page */
  --page-bg:#e8e5f2; --frame:#0b1026; --panel:#ffffff; --panel-line:#e3e1ea;
  /* app (Figma et-color tokens) */
  --canvas:#ffffff; --surface:#f3f3f6; --sunken:#eaeaef; --ink:#0b1026; --ink2:#545871; --muted:#5f6378; --tert:#8b8ea3;
  --border:#e3e1ea; --divider:#eceaf2; --brand:#7c3aed; --brand-ink:#5b21b6; --on-brand:#ffffff; --info:#f4f1fd;
  --lime:#c6f43b; --danger:#c42b31; --danger-bg:#fdecec; --ok:#1f8a4c; --ok-bg:#e6f6ec; --warn-bg:#fff4d6; --warn:#8a5a00;
  --nav:rgba(255,255,255,.86); --scrim:rgba(11,16,38,.45);
  --peach-bg:#ffe7d6; --peach-fg:#8a3410; --mango-bg:#ffe39a; --mango:#ffc53d; --leaf:#3fa34d; --mango-ink:#2b1d0e;
  --map-ground:#eef0e7; --map-road:#ffffff; --map-green:#cfe6b4; --map-bldg:#dedbe8; --map-water:#c3e2f2; --map-label:#5f6378;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page-bg:#06081a; --frame:#2a2f52; --panel:#0f1430; --panel-line:#232a4d;
  --canvas:#0b1026; --surface:#1d2346; --sunken:#262d55; --ink:#f3f2fa; --ink2:#c3c5d6; --muted:#9a9db3; --tert:#7b7e96;
  --border:#283050; --divider:#1f2544; --brand:#9b6bff; --brand-ink:#c9b0ff; --on-brand:#ffffff; --info:#1d1840;
  --danger:#ff7a7f; --danger-bg:#3a1518; --ok:#5fd393; --ok-bg:#12301f; --warn-bg:#3a2e0e; --warn:#ffd36b;
  --nav:rgba(16,21,48,.86); --scrim:rgba(0,0,0,.6);
  --peach-bg:#3a2416; --peach-fg:#ffb98a; --mango-bg:#4a3a10;
  --map-ground:#121733; --map-road:#212849; --map-green:#1d3a2b; --map-bldg:#262c50; --map-water:#173a52; --map-label:#8f93ad;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page-bg:#06081a; --frame:#2a2f52; --panel:#0f1430; --panel-line:#232a4d;
  --canvas:#0b1026; --surface:#1d2346; --sunken:#262d55; --ink:#f3f2fa; --ink2:#c3c5d6; --muted:#9a9db3; --tert:#7b7e96;
  --border:#283050; --divider:#1f2544; --brand:#9b6bff; --brand-ink:#c9b0ff; --on-brand:#ffffff; --info:#1d1840;
  --danger:#ff7a7f; --danger-bg:#3a1518; --ok:#5fd393; --ok-bg:#12301f; --warn-bg:#3a2e0e; --warn:#ffd36b;
  --nav:rgba(16,21,48,.86); --scrim:rgba(0,0,0,.6);
  --peach-bg:#3a2416; --peach-fg:#ffb98a; --mango-bg:#4a3a10;
  --map-ground:#121733; --map-road:#212849; --map-green:#1d3a2b; --map-bldg:#262c50; --map-water:#173a52; --map-label:#8f93ad;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{touch-action:manipulation;background:var(--page-bg);color:var(--ink);font-family:var(--f-body);font-size:calc(15px*var(--ts,1));line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.stage{min-height:100%;display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{width:390px;max-width:100%;height:min(844px,calc(100vh - 48px));min-height:640px;border-radius:54px;background:var(--canvas);color:var(--ink);position:relative;overflow:hidden;box-shadow:0 0 0 11px var(--frame),0 30px 80px rgba(11,16,38,.3);display:flex;flex-direction:column;flex-shrink:0;margin:11px}
.statusbar{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 40px;font-family:var(--f-num);font-weight:700;font-size:calc(16px*var(--ts,1))}
.statusbar .sb{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:9px;background:var(--ink);z-index:60;pointer-events:none}
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.tabpad{padding-bottom:120px}
@media (max-width:520px){
  .stage{padding:0;gap:0}
  body{background:var(--canvas)}
  .phone{position:fixed;left:0;right:0;top:0;bottom:0;height:var(--appH,auto);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);width:auto;min-height:0;border-radius:0;box-shadow:none;margin:0}
  html.standalone .phone{bottom:auto}
  .statusbar,.homebar{display:none}
}
/* type */
.display{font-family:var(--f-display);font-weight:700;font-size:calc(30px*var(--ts,1));line-height:calc(38px*var(--ts,1));letter-spacing:-.6px;text-wrap:balance}
.h1{font-family:var(--f-display);font-weight:700;font-size:calc(24px*var(--ts,1));line-height:calc(32px*var(--ts,1));text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:700;font-size:calc(18px*var(--ts,1));line-height:calc(26px*var(--ts,1))}
.h3{font-family:var(--f-display);font-weight:700;font-size:calc(16px*var(--ts,1));line-height:calc(22px*var(--ts,1))}
.lbl{font-weight:600;font-size:calc(14px*var(--ts,1));line-height:calc(20px*var(--ts,1))}
.cap{font-size:calc(12px*var(--ts,1));line-height:calc(18px*var(--ts,1));color:var(--muted)}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.hl{background:var(--lime);color:#0b1026;padding:0 10px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:calc(17px*var(--ts,1));transition:transform .12s,box-shadow .12s,opacity .12s}
.btn.block{width:100%}
.btn.primary{background:var(--brand);color:var(--on-brand);box-shadow:4px 4px 0 var(--lime)}
.btn.primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--lime)}
.btn.dark{background:var(--ink);color:var(--canvas)}
.btn.soft{background:var(--surface);color:var(--ink)}
.btn.ghost{color:var(--brand-ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:44px;padding:0 18px;font-size:calc(14px*var(--ts,1))}
.btn[disabled],.btn.disabled{opacity:.38;box-shadow:none;pointer-events:none}
.iconbtn{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--ink);flex:none}
.iconbtn.plain{background:none}
.link{color:var(--brand-ink);font-weight:600}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px} svg.i.xs{width:15px;height:15px} svg.i.lg{width:28px;height:28px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;min-height:36px;padding:4px 15px;border-radius:999px;border:1px solid var(--border);background:var(--canvas);font-weight:600;font-size:calc(14px*var(--ts,1));display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.chip.brand.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.ai{border-style:dashed;border-color:var(--brand)}
.chip[disabled]{opacity:.4}
/* header */
.topbar{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;flex:none}
.topbar .t{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:calc(17px*var(--ts,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{width:40px;flex:none}
.hdr-home{padding:6px 20px 0;flex:none}
.hdr-row{display:flex;align-items:center;gap:10px}
.uni{font-family:var(--f-display);font-weight:700;font-size:calc(30px*var(--ts,1));line-height:calc(38px*var(--ts,1));display:flex;align-items:center;gap:6px}
.feedtabs{display:flex;gap:22px;margin-top:6px;border-bottom:1px solid var(--divider);align-items:flex-end}
.feedtab{font-family:var(--f-display);font-weight:700;font-size:calc(17px*var(--ts,1));color:var(--tert);padding:8px 0 10px;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.feedtab.on{color:var(--ink);border-color:var(--ink)}
.verified{display:inline-flex;color:var(--brand)}
/* tabbar */
.tabbar{position:absolute;left:16px;right:16px;bottom:22px;height:64px;border-radius:999px;background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(11,16,38,.06),0 12px 32px rgba(11,16,38,.14);display:grid;grid-template-columns:repeat(3,1fr);align-items:center;z-index:30;padding:0 8px}
@media (max-width:520px){.tabbar{bottom:12px}}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:calc(12px*min(var(--ts,1),1.2));font-weight:600;color:var(--ink2);min-height:52px;margin:0 6px;border-radius:999px;position:relative}
.tab.on{color:var(--ink);background:var(--surface)}
.tab .dot{position:absolute;top:3px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:#d1242f;color:#fff;font-family:var(--f-num);font-size:calc(11px*var(--ts,1));font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.fab{width:54px;height:54px;border-radius:999px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--lime)}
.fab-float{position:absolute;right:20px;bottom:102px;z-index:31;width:58px;height:58px;border-radius:20px;box-shadow:4px 4px 0 var(--lime),0 10px 24px rgba(124,58,237,.35)}
.fab-float:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--lime)}
@media (max-width:520px){.fab-float{bottom:92px}}
/* post card */
.post{padding:16px 20px;border-bottom:1px solid var(--divider);display:block;width:100%;text-align:left}
.post.pinned{background:var(--info)}
.phead{display:flex;gap:10px;align-items:flex-start}
.pname{font-weight:700;font-size:calc(15px*var(--ts,1));display:flex;align-items:center;gap:4px;flex-wrap:wrap;line-height:calc(20px*var(--ts,1))}
.pmeta{font-size:calc(12px*var(--ts,1));color:var(--muted);line-height:calc(18px*var(--ts,1))}
.av{border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;flex:none;overflow:hidden;background-size:cover;background-position:center}
.ptext{margin-top:8px;font-size:calc(15px*var(--ts,1));line-height:calc(24px*var(--ts,1));white-space:pre-wrap;word-break:break-word}
.tag{color:var(--brand-ink);font-weight:600}
.mention{color:var(--brand-ink);font-weight:700}
.pimgs{display:grid;gap:4px;margin-top:10px;border-radius:14px;overflow:hidden}
.pimgs.n1{grid-template-columns:1fr}.pimgs.n2{grid-template-columns:1fr 1fr}.pimgs.n3,.pimgs.n4{grid-template-columns:1fr 1fr}
.pimg{aspect-ratio:4/3;max-width:100%;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--tert);background-size:cover;background-position:center}
.pimgs.n1 .pimg{aspect-ratio:16/10}
.pacts{display:flex;align-items:center;gap:4px;margin-top:10px;margin-left:-8px}
.pact{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;color:var(--ink2);font-family:var(--f-num);font-weight:600;font-size:calc(13px*var(--ts,1))}
.pact.ate.on{color:#ff5a1f}
.pact.ate.on svg{fill:#ff5a1f;stroke:#ff5a1f}
.pact .ate-l{font-size:calc(12px*var(--ts,1));font-weight:800;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:1px 9px;border-radius:999px;font-size:calc(12px*var(--ts,1));font-weight:600;background:var(--surface);color:var(--ink2);white-space:nowrap}
.pill.brand{background:var(--info);color:var(--brand-ink)}
.pill.op{background:var(--info);color:var(--brand-ink);height:20px}
.pill.lime{background:var(--lime);color:#0b1026}
.pill.spot{background:var(--lime);color:#0b1026;font-weight:700}
.pill.live{background:#d1242f;color:#fff;font-weight:800;letter-spacing:.3px}
.pill.live::before{content:"";width:7px;height:7px;border-radius:9px;background:#fff;animation:lv 1.2s ease-in-out infinite}
@keyframes lv{50%{opacity:.25}}
.livering{animation:lring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes lring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.row[disabled]{opacity:.55;cursor:not-allowed}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.oq{background:transparent;border:1px dashed var(--tert);color:var(--muted)}
.lp{margin-top:10px;border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;gap:0}
.lp .lpi{width:84px;flex:none;background:linear-gradient(135deg,var(--info),var(--sunken));display:flex;align-items:center;justify-content:center;color:var(--brand-ink)}
.lp .lpb{padding:10px 12px;min-width:0}
.poll{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.popt{position:relative;height:44px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;padding:0 14px;overflow:hidden;font-weight:600;font-size:calc(14px*var(--ts,1));width:100%;text-align:left}
.popt .bar{position:absolute;inset:0 auto 0 0;background:var(--info);z-index:0;transition:width .4s}
.popt.mine .bar{background:color-mix(in srgb,var(--brand) 22%,var(--canvas))}
.popt span{position:relative;z-index:1}
.popt .pc{margin-left:auto;font-family:var(--f-num)}
/* lists & rows */
.row{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%;text-align:left;min-height:56px}
.row + .row{border-top:1px solid var(--divider)}
.row .rt{flex:1;min-width:0}
.row .rv{color:var(--muted);font-size:calc(14px*var(--ts,1))}
.section-t{padding:20px 20px 6px;font-size:calc(12px*var(--ts,1));font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.card{background:var(--surface);border-radius:16px}
.banner{margin:12px 20px;padding:14px 16px;border-radius:16px;background:var(--info);display:flex;gap:12px;align-items:flex-start}
.banner.warn{background:var(--warn-bg)} .banner.danger{background:var(--danger-bg)} .banner.ok{background:var(--ok-bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:calc(13px*var(--ts,1));font-weight:600;color:var(--ink2)}
.input{min-height:50px;border-radius:14px;border:1.5px solid var(--border);background:var(--canvas);padding:0 14px;font-size:calc(16px*var(--ts,1));width:100%}
.input:focus{outline:none;border-color:var(--brand)}
.input.err{border-color:var(--danger)}
textarea.input{height:auto;padding:12px 14px;resize:none;line-height:calc(24px*var(--ts,1))}
.err-t{color:var(--danger);font-size:calc(13px*var(--ts,1));font-weight:600}
.ok-t{color:var(--ok);font-size:calc(13px*var(--ts,1));font-weight:600}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;text-align:left;width:100%}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.box.on{background:var(--brand);border-color:var(--brand)}
.toggle{width:50px;height:30px;border-radius:999px;background:var(--sunken);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.toggle.on{background:var(--brand)} .toggle.on::after{left:23px}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px}
.seg{padding:4px!important}
.seg button{position:relative;min-height:36px;padding:0 14px;border-radius:999px;font-weight:700;font-size:calc(13px*var(--ts,1));color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--canvas)}
.radio{width:22px;height:22px;border-radius:999px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center}
.radio.on{border-color:var(--brand)} .radio.on::after{content:"";width:12px;height:12px;border-radius:9px;background:var(--brand)}
.empty{padding:48px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ill{width:72px;height:72px;border-radius:24px;background:var(--info);color:var(--brand);display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);box-shadow:4px 4px 0 var(--lime)}
.skel{background:linear-gradient(90deg,var(--surface),var(--sunken),var(--surface));background-size:200% 100%;animation:sk 1.1s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
/* overlay */
#overlay{position:absolute;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);pointer-events:auto;animation:fade .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--canvas);border-radius:28px 28px 0 0;padding:10px 0 34px;pointer-events:auto;max-height:88%;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 8px}
.sheet .sh-t{padding:6px 20px 10px;font-family:var(--f-display);font-weight:700;font-size:calc(19px*var(--ts,1))}
.sheet .sh-b{overflow-y:auto;min-height:0}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--canvas);border-radius:24px;padding:22px;pointer-events:auto;animation:fade .18s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
#toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:70;pointer-events:none}
.toast{background:var(--ink);color:var(--canvas);padding:11px 18px;border-radius:999px;font-weight:600;font-size:calc(14px*var(--ts,1));box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;white-space:nowrap;animation:up .2s;pointer-events:auto}
.toast button{color:var(--lime);font-weight:700}
.spinner{width:22px;height:22px;border-radius:999px;border:3px solid var(--info);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* onboarding */
.ob{flex:1;display:flex;flex-direction:column;min-height:0}
.ob-body{flex:1;min-height:0;overflow-y:auto;padding:8px 24px 16px;scrollbar-width:none}
.ob-foot{padding:12px 24px 34px;display:flex;flex-direction:column;gap:12px;align-items:center;flex:none}
.hero{position:relative;height:300px;margin:8px 0 18px}
.hero .card1{position:absolute;inset:20px 18px 30px 22px;background:var(--brand);border-radius:30px;box-shadow:12px 12px 0 var(--lime);transform:rotate(-3deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.logo{background:#fff;color:#0b1026;font-family:var(--f-num);font-weight:800;font-size:calc(44px*var(--ts,1));line-height:.92;letter-spacing:-1px;padding:10px 18px;border-radius:18px;border:4px solid #0b1026;box-shadow:6px 6px 0 #0b1026;transform:rotate(-5deg);text-align:center}
.dots{display:flex;gap:6px}

.segbar{flex:1;display:flex;gap:6px}.segbar i{flex:1;height:4px;border-radius:9px;background:var(--surface)}.segbar i.on{background:var(--brand)}

.unirow{display:flex;align-items:center;gap:14px;padding:14px;border:1.5px solid var(--border);border-radius:16px;width:100%;text-align:left}
.unirow.on{border-color:var(--brand);background:var(--info)}
.unilogo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:800;font-size:calc(13px*var(--ts,1));color:#fff;flex:none}
/* map */
.mapwrap{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--map-ground)}
.mapwrap svg.map{position:absolute;inset:0;width:100%;height:100%}
.mapchips{position:absolute;top:10px;left:0;right:0;z-index:5}

.pinb{cursor:pointer}
.recentre{position:absolute;right:14px;z-index:6;width:44px;height:44px;border-radius:999px;background:var(--canvas);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(11,16,38,.15);color:var(--brand)}
.gattr{position:absolute;left:10px;z-index:6;font-size:calc(11px*var(--ts,1));font-weight:700;color:var(--map-label);font-family:var(--f-num)}
.bsheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--canvas);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(11,16,38,.12);display:flex;flex-direction:column;transition:height .25s cubic-bezier(.2,.8,.2,1)}
.bsheet .grabb{padding:20px 0 19px;margin-bottom:-12px;display:flex;justify-content:center;width:100%;flex:none}
.bsheet .grabb i{width:40px;height:5px;border-radius:9px;background:var(--border)}
.bcards{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.bcards::-webkit-scrollbar{display:none}
.bcard{flex:none;width:250px;border:1px solid var(--border);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--canvas)}
.btype{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.t-study{background:#e8f0ff;color:#2556c7}.t-food{background:#ffefe0;color:#b4520f}.t-event{background:#f4e9ff;color:#7c3aed}.t-faculty{background:#e7f6f0;color:#14805a}.t-sports{background:#fff6d6;color:#8a6400}.t-life{background:#ffe8f1;color:#c22a6a}
:root[data-theme="dark"] .btype{filter:brightness(.85) saturate(1.2)}
.pbanner{height:118px;background:#0b1026;position:relative;overflow:hidden;flex:none}
.pbanner svg{position:absolute;inset:0;width:100%;height:100%}
.pav{position:relative;z-index:2;border-radius:999px;box-shadow:0 0 0 4px var(--canvas),6px 6px 0 4px var(--lime);display:inline-flex}
.composer-ta{width:100%;border:0;background:color-mix(in srgb,var(--ink) 4%,var(--canvas));border-radius:16px;padding:14px 16px;box-sizing:border-box;resize:none;font-size:calc(17px*var(--ts,1));line-height:calc(27px*var(--ts,1));min-height:120px;outline:none}
.tb{display:flex;align-items:center;gap:4px;padding:8px 12px;border-top:1px solid var(--divider);flex:none}
.tb .iconbtn{background:none;color:var(--brand);flex:none}
.tbtools{display:flex;align-items:center;gap:0;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}.tbtools::-webkit-scrollbar{display:none}
.cmpcount{display:flex;justify-content:flex-end;padding:0 16px;min-height:18px;flex:none}
.cplace{border-top:1px solid var(--divider);padding:10px 0 8px;flex:none}
.cdock-l{padding:0 20px 6px}
.tb .btn.cpost{height:46px;min-width:96px;padding:0 22px;border-radius:999px;flex:none;box-shadow:3px 3px 0 var(--lime)}
.tb .btn.cpost:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--lime)}
.tb .btn.cpost.disabled,.tb .btn.cpost:disabled{box-shadow:none;opacity:.45}
.ring{width:24px;height:24px;margin-left:auto}
.suggest{border-top:1px solid var(--divider);max-height:220px;overflow-y:auto;flex:none;background:var(--canvas)}
.cbar{display:flex;gap:10px;align-items:flex-end;padding:10px 14px 30px;border-top:1px solid var(--divider);background:var(--canvas);flex:none}
@media (max-width:520px){.cbar{padding-bottom:12px}}
.cinput{flex:1;min-height:44px;max-height:120px;border-radius:22px;background:var(--surface);border:0;padding:10px 16px;resize:none;line-height:calc(24px*var(--ts,1));outline:none;font-size:calc(16px*var(--ts,1))}
.cmt{display:flex;gap:10px;padding:12px 20px}
.cmt.reply{padding-left:62px}
.cmt .cb{flex:1;min-width:0}
.voice{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;margin-top:6px;width:min(250px,100%)}
.voice .play{position:relative;width:40px;height:40px;border-radius:99px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.wave{flex:1;display:flex;gap:2px;align-items:center;height:24px}
.wave i{flex:1;background:var(--tert);border-radius:2px}
.wave.playing i{background:var(--brand)}
.notif{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--divider);width:100%;text-align:left;align-items:flex-start}
.notif.unread{background:var(--info)}
.nicon{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
/* panel */
.panel{width:360px;max-width:100%;background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:18px;color:var(--ink);font-size:calc(13px*var(--ts,1));position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto}
@media (max-width:520px){.panel{display:none;position:fixed;inset:0;max-height:none;border-radius:0;border:0;width:100%;z-index:200;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}.panel.open{display:flex}.panel .pclose{display:inline-flex!important}}
.pclose{display:none}
.panel h2{font-family:var(--f-display);font-size:calc(18px*var(--ts,1));line-height:calc(24px*var(--ts,1));margin:0}
.panel h3{font-size:calc(11px*var(--ts,1));letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--panel-line);font-size:calc(12px*var(--ts,1));font-weight:600;background:var(--canvas)}
.pbtn:hover{border-color:var(--brand);color:var(--brand-ink)}
.pbtn.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.evlog{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:calc(11px*var(--ts,1));line-height:calc(16px*var(--ts,1));display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.ev{padding:6px 8px;border-radius:8px;background:var(--surface);word-break:break-word}
.ev b{color:var(--brand-ink)}
.ev .t{color:var(--muted)}
.kbd{font-family:ui-monospace,Menlo,monospace;background:var(--surface);padding:1px 6px;border-radius:6px;font-size:calc(12px*var(--ts,1))}

/* ui-ux-pro-max pass: hit areas, press feedback, motion */
button,[data-act]{cursor:pointer;-webkit-tap-highlight-color:transparent}
[disabled],.disabled{cursor:not-allowed}
.chip::after,.seg button::after,.pill[data-act]::after,.voice .play::after{content:"";position:absolute;inset:-4px -2px}
.pill[data-act]{position:relative;min-height:30px;padding:0 11px}
.pill[data-act]::after{inset:-7px -2px}
.lbl[data-act],.link[data-act],button.link{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
.chip,.iconbtn,.pact,.seg button,.tab,.pill[data-act],.fab,.btn,.play,.bcard,.unirow{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .15s,color .15s,border-color .15s,box-shadow .15s}
.chip:active,.iconbtn:active,.pact:active,.seg button:active,.tab:active,.pill[data-act]:active,.play:active,.btn:not(.primary):active,.bcard:active,.unirow:active{transform:scale(.95)}
.row,.notif,.post{transition:background-color .15s}
.row:active,.notif:active,.post:active:not(:has(button:active,.tag:active)){background:var(--surface)}
.pact.ate.on svg{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{40%{transform:scale(1.3)}}
.screen.fwd{animation:slideIn .24s cubic-bezier(.2,.8,.2,1)}
.screen.back{animation:slideBack .2s cubic-bezier(.2,.8,.2,1)}
.screen.tabfade{animation:fade .16s ease-out}
@keyframes slideIn{from{transform:translateX(28px);opacity:.4}}
@keyframes slideBack{from{transform:translateX(-24px);opacity:.5}}
.grabzone{padding:8px 0 10px;touch-action:none;cursor:grab}
.grabzone .grab{margin:0 auto}
.ovghost{position:absolute;inset:0;z-index:49;pointer-events:none}
.ovghost .sheet{animation:down .17s ease-in forwards}
.ovghost .dialog{animation:fadeout .14s ease-in forwards}
.ovghost .scrim{animation:fadeout .17s ease-in forwards}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadeout{to{opacity:0}}
img.pimg{display:block;width:100%;height:auto;object-fit:cover}


/* bubble sheet: keep its cards clear of the floating nav bar */
.mapwrap{--peek:310px}
.bsheet.peek{padding-bottom:94px}
@media (max-width:520px){.bsheet.peek{padding-bottom:84px}.mapwrap{--peek:300px}}

/* ===== v1.5 comfort refresh: more air, fewer competing accents, calmer motion ===== */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}
body{font-size:calc(16px*var(--ts,1));line-height:1.6}
.pad{padding:0 22px}
.cap{font-size:calc(13px*var(--ts,1));line-height:calc(19px*var(--ts,1))}
.h1{font-size:calc(25px*var(--ts,1));line-height:calc(33px*var(--ts,1));letter-spacing:-.3px}
.h2{font-size:calc(19px*var(--ts,1));line-height:calc(27px*var(--ts,1))}
/* header: lighter title, tabs without a hard rule */
.hdr-home{padding:10px 22px 0}
.uni{font-size:calc(26px*var(--ts,1));line-height:calc(34px*var(--ts,1));letter-spacing:-.3px}
.feedtabs{gap:24px;margin-top:10px;border-bottom:0;align-items:center}
.feedtab{position:relative;padding:8px 0 12px;border-bottom:0;margin-bottom:0;color:var(--tert)}
.feedtab.on{color:var(--ink)}
.feedtab.on::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:3px;border-radius:9px;background:var(--brand)}
.hdr-sort{margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface)}
.hdr-sort button{min-height:32px;padding:0 12px;border-radius:999px;font-size:calc(13px*var(--ts,1));font-weight:600;color:var(--muted);transition:background-color .2s var(--ease-out),color .2s var(--ease-out)}
.hdr-sort button.on{background:var(--canvas);color:var(--ink);box-shadow:0 1px 3px rgba(11,16,38,.10)}
/* chips: soft fills instead of outlined boxes and black selection */
.chips{gap:8px;padding:4px 22px}
.chip{border:0;background:var(--surface);color:var(--ink2);font-weight:500;min-height:38px;padding:4px 16px}
.chip.on{background:var(--ink);color:var(--canvas);border-color:transparent;font-weight:600}
.chip.ai{border:1px dashed var(--brand);background:var(--info)}
/* segmented control: lifted thumb, not an inverted block */
.seg{background:var(--surface)}
.seg button{font-weight:600;color:var(--muted);transition:background-color .2s var(--ease-out),color .2s var(--ease-out)}
.seg button.on{background:var(--canvas);color:var(--ink);box-shadow:0 1px 3px rgba(11,16,38,.10)}
/* buttons: drop the sticker offset outside the hero, keep a soft lift */
.btn{font-weight:650;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out)}
.btn.primary{box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 28%,transparent)}
.btn.primary:active,.btn:active{transform:scale(.97);box-shadow:0 3px 10px color-mix(in srgb,var(--brand) 22%,transparent)}
.fab-float{border-radius:20px;width:58px;height:58px;box-shadow:4px 4px 0 var(--lime),0 12px 26px color-mix(in srgb,var(--brand) 30%,transparent)}
.fab-float:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--lime),0 6px 14px color-mix(in srgb,var(--brand) 24%,transparent)}
.iconbtn{background:transparent}
.hdr-row .iconbtn,.topbar .iconbtn{background:var(--surface)}
/* post card: more breathing room, one quiet hairline, softer meta */
.post{padding:20px 22px 12px;border-bottom:0;position:relative}
.post::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:1px;background:var(--divider)}
.post.pinned{background:color-mix(in srgb,var(--info) 70%,var(--canvas));}
.phead{gap:12px;align-items:center}
.pname{font-size:calc(15px*var(--ts,1));font-weight:650}
.pmeta{font-size:calc(13px*var(--ts,1));color:var(--tert);line-height:calc(19px*var(--ts,1))}
.ptext{word-break:normal;overflow-wrap:break-word;margin-top:12px;font-size:calc(16px*var(--ts,1));line-height:calc(26px*var(--ts,1));color:var(--ink)}
.pimgs{margin-top:14px;border-radius:18px;gap:3px}
.ptags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ptag{font-size:calc(13px*var(--ts,1));color:var(--tert);font-weight:500}
.ptags .pill.brand{background:transparent;padding:0;min-height:24px;color:var(--brand-ink);font-weight:600}
.pacts{margin-top:6px;gap:8px}
.pact{color:var(--tert);font-weight:600}
.pact .ate-l{font-weight:700;letter-spacing:.02em}
.pill{min-height:26px;padding:2px 10px;font-weight:600}
/* rows, sections, banners */
.row{padding:16px 22px;min-height:60px;gap:16px}
.row + .row{border-top:0;box-shadow:none;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--divider);pointer-events:none}
.section-t{padding:26px 22px 8px;letter-spacing:.04em;color:var(--tert)}
.banner{margin:14px 22px;padding:16px 18px;border-radius:20px;gap:14px}
.card{border-radius:20px}
/* bubble sheet cards: borderless, softer */
.bcard{border:0;background:var(--surface);border-radius:20px;padding:14px;gap:10px}
.bcards{gap:12px;padding:4px 18px 14px}
/* sheets and toasts: calmer, iOS-like motion */
.sheet{animation:up .3s var(--ease-drawer);border-radius:30px 30px 0 0}
@keyframes up{from{transform:translateY(100%)}}
.scrim{animation:fade .2s var(--ease-out)}
.screen.fwd{animation:slideIn .26s var(--ease-out)}
.screen.back{animation:slideBack .22s var(--ease-out)}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}}
@keyframes slideBack{from{transform:translateX(-18px);opacity:0}}
.toast{padding:12px 20px;box-shadow:0 12px 32px rgba(11,16,38,.18)}
.chip,.iconbtn,.pact,.tab,.bcard,.unirow,.seg button,.hdr-sort button{transition:transform 160ms var(--ease-out),background-color .2s var(--ease-out),color .2s var(--ease-out)}
.chip:active,.iconbtn:active,.pact:active,.seg button:active,.tab:active,.bcard:active,.unirow:active,.hdr-sort button:active{transform:scale(.97)}
.pill.live::before{animation-duration:1.6s}
/* avatar photo picker */
.avpick{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:4px}
.avpick button{aspect-ratio:1;border-radius:999px;background-size:cover;background-position:center;box-shadow:0 0 0 2px var(--canvas),0 0 0 2px var(--border);transition:transform 160ms var(--ease-out),box-shadow .2s var(--ease-out)}
.avpick button.on{box-shadow:0 0 0 2px var(--canvas),0 0 0 4px var(--brand)}
.avpick button:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){.screen.fwd,.screen.back,.sheet{animation:fade .2s ease}}
.bcards{flex:none;align-items:stretch}
.bcard{width:268px;min-width:0}
.bcard .cap{white-space:normal}
.bcard .bmeta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:2px}
.gattr{background:color-mix(in srgb,var(--canvas) 75%,transparent);padding:1px 6px;border-radius:6px}
.mapwrap svg.map{top:44px;height:calc(100% - var(--peek) - 58px);transition:height .25s var(--ease-out)}
@media (max-height:720px){.bcard .cap[style*="line-clamp"]{-webkit-line-clamp:1!important}.bcard{gap:8px;padding:12px}.bsheet .grabb{padding:14px 0 15px}}
.no-tr *,.no-tr *::before,.no-tr *::after{transition:none!important}
/* phone pass */
.kb .tabbar,.kb .fab-float{display:none}
.kb .cbar{padding-bottom:10px}
.mobile-only{display:none!important}
@media (max-width:520px){.mobile-only{display:inline-flex!important}}
#rotate{display:none;position:fixed;inset:0;z-index:300;background:#0b1026;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;font-family:var(--f-display)}
#rotate svg{width:48px;height:48px;stroke:#c6f43b}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){#rotate{display:flex}}
@media (max-width:359px){.pad{padding:0 16px}.chips{padding:2px 16px}.hdr-home{padding-left:16px;padding-right:16px}.uni{font-size:calc(26px*var(--ts,1))}.display{font-size:calc(26px*var(--ts,1));line-height:calc(34px*var(--ts,1))}.ob-body{padding-left:18px;padding-right:18px}.ob-foot{padding-left:18px;padding-right:18px}.post{padding-left:16px;padding-right:16px}.fab-float{right:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* full-bleed phone: content runs to the bottom edge, controls clear the home indicator */
@media (max-width:520px){
  :root{--sab:env(safe-area-inset-bottom,0px)}
  .screen{padding-bottom:var(--sab)}

  .kb .screen{padding-bottom:0}
}
/* v1.7 contrast pass: controls on tinted surfaces get the page colour plus a hairline, so their shape reads */
.banner .chip:not(.on),.card .chip:not(.on),.sheet .chip:not(.on),.adcard .chip:not(.on){background:var(--canvas);color:var(--ink);box-shadow:inset 0 0 0 1px var(--border),0 1px 2px rgba(11,16,38,.06)}
.banner .chip .num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:calc(11px*var(--ts,1))!important;opacity:1}
.banner .chip svg{color:var(--brand-ink)}
.banner{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 14%,transparent)}

/* v1.7: comment media, ad slots, GIF/voice posts */
.gifbtn{font:800 12px/1 var(--f-num);letter-spacing:.02em}
.pgif{margin-top:10px;width:min(300px,100%)}
.precbar{display:flex;align-items:center;gap:8px;margin-top:10px;height:48px;border-radius:24px;background:var(--danger-bg);padding:0 6px 0 16px;color:var(--danger);font-weight:700}
.precbar .dot{width:10px;height:10px;border-radius:9px;background:var(--danger)}
.catt{display:flex;align-items:center;gap:10px;padding:8px 16px 0;flex:none}
.catt-i{position:relative;width:64px;height:48px;border-radius:10px;overflow:hidden;background:var(--sunken)}

function fmtDate(t){return new Date(t).toLocaleString(S.lang==='th'?'th-TH':'en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}

/* ============ avatars ============ */
function avatar(u,size=40){
  if(u.photo) return `<span class="av" style="width:${size}px;height:${size}px;background-image:url('${u.photo}')"></span>`;
  const ini=u.ini||(u.name?[...u.name][0]:'?');
  return `<span class="av" style="width:${size}px;height:${size}px;background:${u.bg};color:${u.fg};font-size:${Math.round(size*.42)}px">${esc(ini)}</span>`;
}
function anonAv(al,size=40){
  return `<span class="av" style="width:${size}px;height:${size}px;background:${al.bg}"><svg viewBox="0 0 40 40" width="${size}" height="${size}"><ellipse cx="20" cy="23" rx="11" ry="12" fill="${al.c}"/><path d="M20 11c2-4 6-5 8-4-2 1-4 3-8 4z" fill="#3fa34d"/><circle cx="16.5" cy="22" r="1.6" fill="#2b1d0e"/><circle cx="23.5" cy="22" r="1.6" fill="#2b1d0e"/><path d="M17.5 26.5q2.5 2 5 0" stroke="#2b1d0e" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span>`;
}
/* who-shows-as for a post or comment, as seen by the viewer */
function authorView(item,postId){
  if(item.anon){const al=aliasOf(postId,item.by);return {anon:true,name:al.name,av:s=>anonAv(al,s),sub:L('นิสิตจุฬาฯ','Chula student'),al};}
  const u=user(item.by);return {anon:false,name:u.name,av:s=>avatar(u,s),sub:facYear(u),u};
}

/* ============ text rendering ============ */
const URL_RE=/((?:https?:\/\/|www\.)[^\s]+|\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|co|th|io|ly|me|app|xyz|gl|to|link|info|ไทย)\b(?:\/[^\s]*)?)/i;
function rich(text,item){
  let h=esc(text);
  h=h.replace(/(^|\s)#([\p{L}\p{M}\p{N}_]+)/gu,(m,a,t)=>`${a}<button class="tag" data-act="openTag" data-arg="${esc(t)}">#${t}</button>`);
  const ments=(item&&item.mentions)||[];
  h=h.replace(/@([a-z0-9._]{3,20})/g,(m,un)=>{
    const id=ments.find(id=>user(id)&&user(id).user===un);
    if(id && !S.removedMentions.includes(item.id+'|'+id)) return `<button class="mention" data-act="openProfile" data-arg="${id}">@${un}</button>`;
    return m;
  });
  h=h.replace(/(https?:\/\/[^\s<]+)/g,u=>`<span class="tag">${u}</span>`);
  return h;
}
function findUrl(t){const m=(t||'').match(URL_RE);return m?m[0]:null;}
function domainOf(u){return u.replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0].toLowerCase();}
function tagsOf(t){return [...(t||'').matchAll(/(?:^|\s)#([\p{L}\p{M}\p{N}_]+)/gu)].map(m=>m[1]);}
function mentionsIn(t){return [...(t||'').matchAll(/@([a-z0-9._]{3,20})/g)].map(m=>m[1]);}

/* ============ selectors ============ */
function viewerCanSee(p){
  if(p.removed) return false;
  if(p.by!=='me'){
    if(S.hidden.includes(p.id)||S.reported.includes('post:'+p.id)) return false;
    if(isBlocked(p.by)) return false;
    if(p.tags.some(t=>S.mutedTags.includes(t.toLowerCase()))) return false;
  }
  return true;
}
function commentsOf(pid){return S.comments.filter(c=>c.post===pid && !c.removed && (c.by==='me'||(!isBlocked(c.by)&&!S.reported.includes('comment:'+c.id))));}
function postsIn(bid){return S.posts.filter(p=>p.bubble===bid && viewerCanSee(p) && Date.now()-p.at<72*HOUR);}
function count24(bid){return S.posts.filter(p=>p.bubble===bid && !p.removed && !S.hidden.includes(p.id) && Date.now()-p.at<DAY).length;}
function hot(p){const h=(Date.now()-p.at)/HOUR;return (p.ate+3*commentsOf(p.id).length+1)/Math.pow(h+2,1.4);}
function sortPosts(list,sort){return list.slice().sort(sort==='new'?(a,b)=>b.at-a.at:(a,b)=>hot(b)-hot(a));}
function meXY(){const h=S.sim.here&&bubble(S.sim.here);return h?{x:h.x+8,y:h.y+10}:ME_XY;}
function distance(b){const m=meXY();const dx=b.x-m.x,dy=b.y-m.y;return Math.round(Math.hypot(dx,dy)*M_PER_UNIT/10)*10;}
function onSpot(b){b=typeof b==='string'?bubble(b):b;return !!b&&locOn()&&distance(b)<=(b.r||80);}
function isLive(b){b=typeof b==='string'?bubble(b):b;return !!b&&b.type==='event'&&bubbleOpen(b)&&!!b.start&&new Date(b.start+'T00:00:00')<=new Date();}
function canTag(b){return bubbleOpen(b)&&(!isLive(b)||onSpot(b));}
function spotPill(){return `<span class="pill spot">${I('pin','xs')} ${L('อยู่ที่นี่จริง','On the spot')}</span>`;}
function livePill(){return `<span class="pill live">LIVE</span>`;}
function hereTag(){return `<span class="pill lime">${L('คุณอยู่ที่นี่','You’re here')}</span>`;}
function locOn(){return S.settings.loc && S.ob.perm.loc==='granted';}
function fmtDist(m){return m<1000?m+L(' ม.',' m'):(m/1000).toFixed(1)+L(' กม.',' km');}
function bubbleOpen(b){if(b.status!=='active')return false;if(b.end&&new Date(b.end+'T23:59:59')<new Date())return false;return true;}

/* ============ navigation ============ */
function top(){return S.nav[S.nav.length-1];}
function hpush(st){try{history.pushState(Object.assign({et:1},st||{}),'');}catch(e){}}
function push(s,a){saveScroll();S.nav.push({s,a});T.anim='fwd';hpush({d:S.nav.length});render();focusTitle();}
function pop(){saveScroll();if(S.nav.length>1)S.nav.pop();T.anim='back';render();focusTitle();}
function setTab(t){saveScroll();S.tab=t;S.nav=[{s:t}];T.anim='tabfade';render();}
function focusTitle(){if(!T.kb)return;const h=document.querySelector('#app [role="heading"]');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}}
function haptic(){try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}}
const OB_PREV={consent:'welcome',sso:'consent',waitlist:'sso',ssoerr:'sso',dob:'sso',profile:'dob',interests:'profile',location:'interests',push:'location'};
window.addEventListener('popstate',e=>{
  if(!(e.state&&e.state.et)&&location.hash&&window.routeOf&&location.hash!=='#'+routeOf()){ if(applyRoute(location.hash)){T.anim='tabfade';render();} return; }
  if(T.ov){ if(T.ov.t!=='aicheck'){ T.ov.t==='sso'?A.ssoCancel():closeOv(); } hpush({d:S.nav.length}); return; }
  if(!S.done){ const prev=OB_PREV[S.ob.step]; if(prev){S.ob.step=prev;T.anim='back';render();} return; }
  if(S.nav.length>1){ if(top().s==='compose'&&S.draft){hpush({d:S.nav.length});A.composeCancel();return;} pop(); }
});

(function(){
  const sa=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches; if(!sa) return;
  const rt=document.documentElement; rt.classList.add('standalone'); let gap=null;
  const size=()=>{const land=Math.abs(window.orientation||0)===90; const full=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
    const d=full-innerHeight; if(d>=0&&d<120) gap=d; /* no keyboard: remember the missing strip */

function syncThemeColor(){const c=getComputedStyle($('#phone')).getPropertyValue('--canvas').trim();if(!c)return;document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',c));}

function applyTheme(){
  const ph=$('#phone');for(const k in LIGHT_VARS)ph.style.removeProperty(k);ph.style.removeProperty('color-scheme');
  applyTextSize();
  const t=S.settings.theme, rt=document.documentElement;
  if(t==='system') delete rt.dataset.theme; else rt.dataset.theme=t;
  rt.style.colorScheme=t==='system'?'':t;
  if(t==='system'){syncThemeColor();return;}
  const v=t==='dark'?DARK_VARS:LIGHT_VARS; for(const k in v) ph.style.setProperty(k,v[k]); syncThemeColor();
  ph.style.colorScheme=t;
}

function classifyEmail(e){
  e=(e||'').trim().toLowerCase(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return {k:'invalid'};
  const d=e.split('@')[1];
  if(d==='alumni.chula.ac.th') return {k:'graduated',d};
  if(WHITELIST.includes(d)) return {k:e.startsWith('6430011121@')?'dup':'ok',d};
  if(PERSONAL.includes(d)) return {k:'personal',d};
  const key=Object.keys(KNOWN_UNI).find(x=>d===x||d.endsWith('.'+x));
  if(key) return {k:'waitlist',d,key,uni:KNOWN_UNI[key]};
  if(/\.(ac\.[a-z]{2}|edu(\.[a-z]{2})?)$/.test(d)) return {k:'waitlist',d,key:d,uni:null};
  return {k:'notuni',d};
}

function validUsername(u){
  if(!u) return {ok:false,msg:''};
  if(u.length<3) return {ok:false,msg:L('สั้นไป ต้องมีอย่างน้อย 3 ตัว','Too short: at least 3 characters')};
  if(!/^[a-z0-9._]+$/.test(u)) return {ok:false,msg:L('ใช้ได้แค่ a–z 0–9 . และ _','Only a–z, 0–9, . and _')};
  const taken=Object.values(USERS).map(x=>x.user).concat(['admin','win','beam']);
  if(taken.includes(u)) return {ok:false,msg:L('@'+u+' มีคนใช้แล้ว ลอง @'+u+'.cu','@'+u+' is taken. Try @'+u+'.cu')};
  return {ok:true,msg:L('@'+u+' ใช้ได้','@'+u+' is available')};
}

/* ============ SEARCH ============ */
function searchResults(q){
  q=q.trim().toLowerCase(); if(!q) return {posts:[],tags:[],people:[]};
  const qt=q.replace(/^#/,'').replace(/^@/,'');
  const posts=S.posts.filter(p=>viewerCanSee(p)&&p.reach!=='reduced'&&(p.text.toLowerCase().includes(qt)));
  const tagset={};S.posts.filter(p=>!p.removed).forEach(p=>p.tags.forEach(t=>{if(t.toLowerCase().includes(qt))tagset[t]=(tagset[t]||0)+1;}));
  TRENDING.forEach(t=>{if(t.toLowerCase().includes(qt)&&!tagset[t])tagset[t]=0;});
  const tags=Object.entries(tagset).sort((a,b)=>b[1]-a[1]);
  const people=Object.values(USERS).filter(u=>!u.official&&!isBlocked(u.id)&&(u.name.toLowerCase().includes(qt)||u.user.includes(qt)));
  return {posts,tags,people};
}

  const q=T.search.q;
  return `<div class="screen"><div class="topbar" style="gap:8px"><button class="iconbtn" data-act="back" aria-label="${L('กลับ','Back')}">${I('back')}</button>
    <div style="flex:1;position:relative"><span style="position:absolute;left:14px;top:11px;color:var(--tert)">${I('search','sm')}</span><input id="searchInput" class="input" style="height:42px;border-radius:999px;padding-left:40px;background:var(--surface);border-color:transparent" placeholder="${L('ค้นหาโพสต์ แฮชแท็ก คน','Search posts, hashtags, people')}" value="${esc(q)}" data-on="search" enterkeyhint="search" autocomplete="off"></div></div>
    <div id="searchBody" class="scroll" style="padding-bottom:40px">${searchBody()}</div></div>`;
}
function searchBody(){
  const q=T.search.q.trim();
  if(!q) return `<div class="section-t">${L('ค้นหาล่าสุด','Recent')}</div>${S.recent.length?S.recent.map(r=>`<button class="row" data-act="searchFill" data-arg="${esc(r)}">${I('clock','sm')}<span class="rt">${esc(r)}</span></button>`).join(''):`<div class="pad cap">${L('ยังไม่มีประวัติค้นหา','No recent searches')}</div>`}
    <div class="section-t">${L('กำลังมาแรงในจุฬาฯ','Trending at Chula')}</div><div style="display:flex;flex-wrap:wrap;gap:8px;padding:0 20px">${TRENDING.slice(0,8).map(t=>`<button class="chip" data-act="openTag" data-arg="${t}" data-src="search">#${t}</button>`).join('')}</div>`;
  const r=searchResults(q); const tab=T.search.tab;
  const tb=(id,label,n)=>`<button class="feedtab ${tab===id?'on':''}" data-act="searchTab" data-arg="${id}">${label} <span class="num" style="font-size:calc(12px*var(--ts,1))">${n}</span></button>`;
  let list='';
  if(tab==='posts') list=r.posts.map(p=>postCard(p,{showWhere:true})).join('');
  if(tab==='tags') list=r.tags.map(([t,n])=>`<button class="row" data-act="openTag" data-arg="${esc(t)}" data-src="search"><span class="btype" style="background:var(--info);color:var(--brand-ink)">${I('hash','sm')}</span><span class="rt"><span class="lbl">#${esc(t)}</span><br><span class="cap">${n} ${L('โพสต์','posts')}</span></span>${I('chev','sm')}</button>`).join('');
  if(tab==='people') list=r.people.map(u=>`<button class="row" data-act="openProfile" data-arg="${u.id}" data-src="search">${avatar(u,44)}<span class="rt"><span class="lbl" style="display:inline-flex;gap:4px;align-items:center">${esc(u.name)} ${VERIFIED}</span><br><span class="cap">@${u.user}${facYear(u)?' · '+facYear(u):''}</span></span></button>`).join('');
  const cnt={posts:r.posts.length,tags:r.tags.length,people:r.people.length}[tab];
  return `<div class="feedtabs" style="padding:0 20px;margin-top:0">${tb('posts',L('โพสต์','Posts'),r.posts.length)}${tb('tags',L('แฮชแท็ก','Hashtags'),r.tags.length)}${tb('people',L('คน','People'),r.people.length)}</div>
   ${cnt?list:`<div class="empty"><div class="ill">${I('search','lg')}</div><div class="h2">${L('ไม่เจอ "'+esc(q)+'"','No results for "'+esc(q)+'"')}</div><p class="ink2" style="margin:0">${L('ลองคำสั้นลง หรือค้นด้วยแฮชแท็ก เช่น #สามย่าน','Try a shorter word, or a hashtag like #สามย่าน')}</p></div>`}
   ${tab==='people'?`<div class="pad cap" style="margin-top:12px">${I('mask','xs')} ${L('ค้นหาคนจะไม่แสดงโพสต์นิรนามของเขา','People results never show anyone’s anonymous posts.')}</div>`:''}`;
}

/* ============ POST DETAIL ============ */
function vPost(id){
  const p=S.posts.find(x=>x.id===id);
  if(!p||!viewerCanSee(p)) return `<div class="screen">${topbar(L('โพสต์','Post'))}<div class="empty"><div class="ill">${I('eyeoff','lg')}</div><div class="h2">${L('โพสต์นี้ไม่พร้อมใช้งาน','This post isn’t available')}</div><p class="ink2" style="margin:0">${S.reported.includes('post:'+id)?L('คุณรายงานโพสต์นี้แล้ว เราซ่อนไว้ให้คุณ','You reported this post, so it’s hidden for you.'):L('โพสต์อาจถูกลบหรือซ่อนไว้','It may have been deleted or hidden.')}</p></div></div>`;
  const a=authorView(p,p.id); const b=p.bubble&&bubble(p.bubble);
  const cs=commentsOf(id); const tops=cs.filter(c=>!c.parent);
  const where=[p.uni?L('มหาลัย','University'):null,b?bname(b):null].filter(Boolean).join(' + ');
  const url=findUrl(p.text);
  const cm=T.cmode||S.settings.mode;
  const cAuthor=cm==='anon'?{av:s=>anonAv(aliasOf(p.id,'me'),s)}:{av:s=>avatar(S.me,s)};
  return `<div class="screen">${topbar(L('โพสต์','Post'))}
   <div class="scroll" id="postScroll">
    <div class="pad"><div class="phead">${a.av(48)}<div style="flex:1;min-width:0"><div class="pname" style="font-size:calc(16px*var(--ts,1))">${esc(a.name)}${a.anon?'':VERIFIED}${p.by==='me'&&p.anon?`<span class="pill lime">${I('lock','xs')} ${L('มีแค่คุณที่เห็น','Only you can see this')}</span>`:''}</div><div class="pmeta">${esc(a.sub)}</div></div><button class="iconbtn" data-act="postMenu" data-arg="${p.id}" aria-label="more">${I('more')}</button></div>
    <div class="ptext" style="font-size:calc(16px*var(--ts,1));line-height:calc(26px*var(--ts,1))">${rich(p.text,p)}</div>
    ${p.images.length?`<div class="pimgs n${p.images.length}">${p.images.map(imgTile).join('')}</div>`:''}${postMedia(p)}${p.poll?pollHTML(p):''}${url&&!p.images.length?linkPreview(url):''}
    <div class="cap" style="margin-top:10px">${fmtDate(p.at)} · ${esc(catName(p.cat))} · ${esc(where)}${p.edited?' · '+L('แก้ไขแล้ว','edited'):''}</div>
    <div style="display:flex;gap:18px;padding:12px 0;border-bottom:1px solid var(--divider)"><span><b class="num">${nf(p.ate)}</b> <span class="muted">ATE</span></span><span><b class="num">${cs.length}</b> <span class="muted">${L('คอมเมนต์','comments')}</span></span></div>
    <div style="display:flex;justify-content:space-around;padding:4px 0;border-bottom:1px solid var(--divider)">
      <button class="pact" data-act="focusComment" aria-label="${L('คอมเมนต์','Comment')}">${I('comment')}</button>
      <button class="pact ate ${p.ated?'on':''}" data-act="ate" data-arg="post:${p.id}" aria-pressed="${p.ated}" aria-label="ATE">${I('flame')}</button>
      <button class="pact" data-act="share" data-arg="${p.id}" aria-label="${L('แชร์','Share')}">${I('share')}</button>
      <button class="pact" data-act="postMenu" data-arg="${p.id}" aria-label="${L('เพิ่มเติม','More')}">${I('more')}</button></div></div>
    <div style="padding:6px 0 24px">${tops.length?tops.map(c=>commentHTML(c,p)+cs.filter(r=>r.parent===c.id).map(r=>commentHTML(r,p,true)).join('')).join(''):`<div class="empty" style="padding:28px"><div class="cap">${L('ยังไม่มีคอมเมนต์ เริ่มคุยเลย','No comments yet. Start the conversation.')}</div></div>`}</div>
   </div>
   <div id="cSuggest"></div>
   ${T.reply?`<div style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);font-size:calc(13px*var(--ts,1));flex:none"><span style="flex:1">${L('ตอบกลับ ','Replying to ')}<b>${esc(T.reply.label)}</b></span><button class="iconbtn plain" style="width:28px;height:28px" data-act="cancelReply" aria-label="cancel">${I('x','sm')}</button></div>`:''}
   <div id="cHint" class="cap" style="padding:0 16px;flex:none"></div>
   ${T.cAtt&&!T.rec?`<div class="catt"><div class="catt-i"><img src="${T.cAtt.src}" alt="">${T.cAtt.kind==='gif'?'<span class="gifb">GIF</span>':''}<button class="catt-x" data-act="cAttClear" aria-label="${L('เอาออก','Remove')}">${I('x','xs')}</button></div><span class="cap">${T.cAtt.kind==='gif'?L('GIF 1 รายการ','1 GIF'):L('รูป 1 รูป · AI ตรวจก่อนขึ้น','1 photo · AI checks it before it shows')}</span></div>`:''}
   <div class="cbar">${T.rec?`<div style="flex:1;display:flex;align-items:center;gap:10px;height:44px;border-radius:22px;background:var(--danger-bg);padding:0 16px;color:var(--danger);font-weight:700"><span style="width:10px;height:10px;border-radius:9px;background:var(--danger)"></span> ${L('กำลังอัด','Recording')} <span class="num" id="recT">0:00</span><span class="cap" style="margin-left:auto">${L('สูงสุด 60 วิ','max 60s')}</span></div><button class="iconbtn" data-act="recCancel" aria-label="cancel">${I('x')}</button><button class="fab" style="width:44px;height:44px;box-shadow:none" data-act="recStop" aria-label="send">${I('send','sm')}</button>`:
     `<button data-act="cmode" style="min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center" aria-label="${L('สลับโหมด','Switch mode')}" style="position:relative">${cAuthor.av(36)}<span style="position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:99px;background:var(--ink);color:var(--canvas);display:flex;align-items:center;justify-content:center">${I('swap','xs')}</span></button>
      <textarea id="cInput" class="cinput" rows="1" maxlength="500" placeholder="${cm==='anon'?L('ตอบในนามนิรนาม…','Reply anonymously…'):L('ตอบในนาม ','Reply as ')+esc(S.me.name)+'…'}" data-on="cInput"></textarea>
      <button class="iconbtn" id="cAttach" data-act="cAttach" aria-label="${L('แนบรูปหรือ GIF','Add a photo or GIF')}">${I('image')}</button>
      <button class="iconbtn" id="cMic" data-act="recStart" aria-label="${L('คอมเมนต์เสียง','Voice comment')}" style="${T.cAtt?'display:none':''}">${I('mic')}</button>
      <button class="fab" id="cSend" style="width:44px;height:44px;box-shadow:none;display:${T.cAtt?'flex':'none'}" data-act="sendComment" aria-label="${L('ส่ง','Send')}">${I('send','sm')}</button>`}</div>
  </div>`;
}
function commentHTML(c,p,isReply){
  const a=authorView(c,p.id); const op=c.by===p.by&&c.anon===p.anon;
  let replyLbl='';
  if(c.replyTo){const r=c.replyTo; const lab=r.anon?aliasOf(p.id,r.uid).name:user(r.uid).name; replyLbl=`<span class="cap" style="color:var(--brand-ink)">${L('ตอบกลับ ','Replying to ')}${esc(lab)}</span><br>`;}
  return `<div class="cmt ${isReply?'reply':''}">${a.av(isReply?30:36)}<div class="cb">
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="lbl">${esc(a.name)}</span>${a.anon?'':VERIFIED}${op?`<span class="pill op">${L('ผู้โพสต์','OP')}</span>`:''}<span class="cap">· ${rel(c.at)}</span></div>
    ${replyLbl}${c.voice?voiceHTML(c):(c.text?`<div style="font-size:calc(14px*var(--ts,1));line-height:calc(22px*var(--ts,1));white-space:pre-wrap;word-break:break-word">${rich(c.text,c)}</div>`:'')}${c.media?`<div class="cmedia"><img src="${c.media.src}" alt="${c.media.kind==='gif'?'GIF':L('รูปในคอมเมนต์','Comment photo')}" loading="lazy">${c.media.kind==='gif'?'<span class="gifb">GIF</span>':''}</div>`:''}
    <div style="display:flex;gap:4px;margin-left:-8px;margin-top:2px">
      <button class="pact" data-act="reply" data-arg="${c.id}">${I('comment','xs')} ${L('ตอบ','Reply')}</button>
      <button class="pact ate ${c.ated?'on':''}" data-act="ate" data-arg="comment:${c.id}">${I('flame','xs')} ${c.ate||''}</button>
      <button class="pact" style="margin-left:auto" data-act="commentMenu" data-arg="${c.id}" aria-label="${L('ตัวเลือกคอมเมนต์','Comment options')}">${I('more','xs')}</button></div></div></div>`;
}
function voiceHTML(c){
  const playing=T.playing===c.id; const bars=Array.from({length:28},(_,i)=>6+Math.abs(Math.sin(i*1.7+c.voice.sec))*16);
  return `<div class="voice"><button class="play" data-act="playVoice" data-arg="${c.id}" aria-label="${playing?L('หยุด','Pause'):L('เล่นคอมเมนต์เสียง','Play voice comment')}">${I(playing?'pause':'play','xs')}</button><div class="wave ${playing?'playing':''}">${bars.map(h=>`<i style="height:${h}px"></i>`).join('')}</div><span class="num cap">0:${String(c.voice.sec).padStart(2,'0')}</span></div>`;
}

/* ============ COMPOSE ============ */
function newDraft(o){return Object.assign({text:'',mode:S.settings.mode,cat:null,catAuto:null,uni:true,bubble:null,images:[],poll:null,gif:null,voice:null,editing:null,src:null},o||{});}
function vCompose(){
  const d=S.draft; const ed=!!d.editing;
  const me=d.mode==='anon'?{av:s=>anonAv({c:'#ffc53d',bg:'#ffe39a'},s),name:L('นิรนาม','Anonymous')}:{av:s=>avatar(S.me,s),name:S.me.name};
  const b=d.bubble&&bubble(d.bubble);
  return `<div class="screen" style="background:var(--canvas)">
   <div class="topbar"><button class="lbl" data-act="composeCancel">${L('ยกเลิก','Cancel')}</button><div class="t">${ed?L('แก้ไขโพสต์','Edit post'):L('โพสต์ใหม่','New post')}</div><span style="width:56px;flex:none"></span></div>
   <div class="scroll">
    <div class="pad">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">${me.av(36)}
        ${ed?`<div class="pname">${esc(me.name)}</div></div>`:`<div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="chip ${d.mode==='identity'?'on':''}" style="font-size:calc(13px*var(--ts,1))" data-act="dmode" data-arg="identity">${I('user','xs')} ${esc(S.me.name||L('ชื่อจริง','Identity'))}</button>
          <button class="chip ${d.mode==='anon'?'on':''}" style="font-size:calc(13px*var(--ts,1))" data-act="dmode" data-arg="anon">${I('mask','xs')} ${L('นิรนาม','Anonymous')}</button></div></div>
          ${d.mode==='anon'?`<div class="cap" style="margin-bottom:6px">${I('shield','xs')} ${L('คนอื่นเห็นแค่ชื่อแฝง แต่ระบบเก็บบัญชีจริงไว้ ถ้าผิดกติกาก็โดนลงโทษได้','Others only see an alias. We keep your real account, so the rules still apply.')}</div>`:''}`}
        <textarea id="cmpText" class="composer-ta" maxlength="1000" placeholder="${L('มีอะไรเกิดขึ้นในรั้วบ้าง?','What’s happening on campus?')}" data-on="cmpText">${esc(d.text)}</textarea>
        <div id="cmpImgs">${composeImgs()}</div>
        ${composeMedia()}
        <div id="cmpPoll">${ed?'':composePoll()}</div>
        <div id="cmpLink">${composeLink()}</div>
      </div>
   </div>
   <div id="cmpSuggest"></div>
   ${ed?'':`<div class="cplace"><div class="cdock-l"><span class="cap" style="font-weight:700;color:var(--ink2)">${L('สถานที่','Place')}</span> <span class="cap">${L('(ไม่บังคับ)','(optional)')}</span></div>
    <div class="chips"><button class="chip ${b?'on':''}" data-act="pickBubble">${I('pin','xs')} ${b?esc(bname(b)):L('เพิ่มสถานที่','Add place')} ${I('down','xs')}</button>
      ${b?`<button class="chip" data-act="clearBubble" aria-label="${L('เอาสถานที่ออก','Remove place')}">${I('x','xs')}</button>`:''}${b&&isLive(b)?livePill():''}${b&&onSpot(b)&&d.mode!=='anon'?spotPill():''}</div>
    <div class="pad cap" id="whereErr" style="margin-top:4px">${placeHelp(d,b)}</div></div>`}
   <div id="cmpCats">${composeCats()}</div>
   <div class="cmpcount"><span id="cmpCount" class="num cap"></span></div>
   <div class="tb"><div class="tbtools">
     <label class="iconbtn" style="cursor:pointer" aria-label="${L('เพิ่มรูป','Add photos')}">${I('image')}<input type="file" accept="image/*" multiple hidden data-on="cmpFiles"></label>
     ${ed?'':`<button class="iconbtn" data-act="addPoll" aria-label="${L('โพล','Poll')}">${I('poll')}</button><button class="iconbtn gifbtn" data-act="addGif" aria-label="GIF">GIF</button><button class="iconbtn" data-act="pRecStart" aria-label="${L('โพสต์เสียง','Voice post')}">${I('mic')}</button>`}
     <button class="iconbtn" data-act="insert" data-arg="#" aria-label="hashtag">${I('hash')}</button>
     <button class="iconbtn" data-act="insert" data-arg="@" aria-label="mention">${I('at')}</button>
     </div>
     <button class="btn primary cpost" id="postBtn" data-act="publish">${ed?L('บันทึก','Save'):L('โพสต์','Post')}</button>
   </div><div style="height:12px;flex:none"></div>
  </div>`;
}
function composeMedia(){
  const d=S.draft;
  if(T.prec) return `<div class="precbar"><span class="dot"></span> ${L('กำลังอัดเสียง','Recording')} <span class="num" id="pRecT">0:00</span><span class="cap" style="margin-left:auto">${L('สูงสุด 60 วิ','max 60s')}</span><button class="iconbtn plain" data-act="pRecCancel" aria-label="${L('ยกเลิก','Cancel')}">${I('x','sm')}</button><button class="btn sm primary" data-act="pRecStop">${L('เสร็จ','Done')}</button></div>`;
  if(d.gif) return `<div class="cmedia" style="margin-top:10px;width:min(260px,100%)"><img src="${d.gif}" alt="GIF"><span class="gifb">GIF</span><button class="catt-x" data-act="rmGif" aria-label="${L('เอาออก','Remove')}">${I('x','xs')}</button></div>`;
  if(d.voice) return `<div style="display:flex;align-items:center;gap:8px;margin-top:10px">${voiceHTML({id:'draftv',voice:d.voice},true)}<button class="iconbtn plain" data-act="rmVoice" aria-label="${L('ลบเสียง','Remove voice')}">${I('x','sm')}</button></div><div class="cap" style="margin-top:4px">${L('ถอดเสียงให้ AI ตรวจก่อนขึ้น ไม่แสดงคำถอดเสียง','Transcribed so AI can check it before it shows. The transcript isn’t shown.')}</div>`;
  return '';
}
function placeHelp(d,b){
  if(!b) return L('ทุกโพสต์ขึ้นฟีดมหาลัย ใส่สถานที่เพื่อให้ขึ้นบนแผนที่บับเบิลด้วย 72 ชม.','Every post goes to University. Add a place to also show it on the Bubble map for 72 hours.');
  if(isLive(b)&&!onSpot(b)) return `<span class="err-t">${L('โพสต์สดในงานนี้ได้เฉพาะคนที่อยู่ในงาน ลบสถานที่เพื่อโพสต์ในฟีดมหาลัย','Only people at this live event can post with it. Remove the place to post to University.')}</span>`;
  if(onSpot(b)) return d.mode==='anon'?L('คุณอยู่ที่นี่ แต่โพสต์นิรนามจะไม่แสดงตรา “อยู่ที่นี่จริง” เพื่อไม่ให้ใครเดาได้ว่าเป็นคุณ','You’re here, but anonymous posts don’t show the On the spot stamp, so nobody can work out it’s you.'):L('คุณอยู่ที่นี่ โพสต์จะได้ตรา “อยู่ที่นี่จริง” · ส่งแค่ว่าใช่/ไม่ใช่ ไม่ส่งตำแหน่ง','You’re here, so your post gets the On the spot stamp. Only yes/no is sent, never your location.');
  return locOn()?L('คุณไม่ได้อยู่ที่นี่ จึงไม่มีตรา “อยู่ที่นี่จริง” แต่โพสต์ได้ตามปกติ','You’re not there, so no On the spot stamp. Posting still works.'):L('ตำแหน่งปิดอยู่ จึงไม่มีตรา “อยู่ที่นี่จริง” แต่โพสต์ได้ตามปกติ','Location is off, so no On the spot stamp. Posting still works.');
}
function composeImgs(){

function composeValid(){
  const d=S.draft; const t=d.text.trim(); const errs=[];
  if(!t&&!d.gif&&!d.voice) errs.push('text');
  if(!d.cat) errs.push('cat');
  if(!d.editing&&d.bubble&&isLive(d.bubble)&&!onSpot(d.bubble)) errs.push('where');
  if(d.poll&&d.poll.opts.filter(o=>o.trim()).length<2) errs.push('poll');
  if(d.images.some(i=>i.failed)) errs.push('img');
  if(tagsOf(d.text).length>5) errs.push('tags');
  if(mentionsIn(d.text).length>5&&d.mode!=='anon') errs.push('mentions');
  const url=findUrl(d.text); if(url&&MOD.blockedDomains.some(x=>domainOf(url).endsWith(x))) errs.push('link');
  return errs;
}

}

/* mention / hashtag autocomplete */
function mentionCandidates(q,postId){
  const pool=Object.values(USERS).filter(u=>!u.official&&u.mentions!=='none'&&!isBlocked(u.id));
  const inThread=postId?new Set([S.posts.find(p=>p.id===postId)?.by].concat(S.comments.filter(c=>c.post===postId&&!c.anon).map(c=>c.by))):new Set();
  const interacted=new Set(['u1','u6']);
  const score=u=>(inThread.has(u.id)?0:interacted.has(u.id)?1:(S.me.fac&&u.fac[1]===S.me.fac[1])?2:3);
  const group=s=>['thread','interacted','faculty','university'][s];
  return pool.filter(u=>!q||u.user.startsWith(q)||u.name.toLowerCase().includes(q)).sort((a,b)=>score(a)-score(b)).slice(0,5).map(u=>({u,group:group(score(u))}));
}
function activeToken(el){
  const v=el.value.slice(0,el.selectionStart); const m=v.match(/(^|\s)([@#])([\p{L}\p{M}\p{N}._]*)$/u); return m?{sym:m[2],q:m[3].toLowerCase(),start:v.length-m[3].length-1}:null;
}
function suggestHTML(tok,mode,ctx){
  if(!tok) return '';
  if(tok.sym==='@'){
    if(mode==='anon') return `<div class="suggest"><div class="banner" style="margin:10px 14px;align-items:center">${I('mask')}<div style="flex:1"><div class="lbl">${L('โหมดไม่ระบุตัวตนแท็กใครไม่ได้','You can’t mention anyone in anonymous mode')}</div><div class="cap" style="color:var(--ink2)">${L('@ จะเป็นข้อความธรรมดา','The @ stays plain text')}</div></div><button class="btn dark sm" data-act="${ctx}Identity">${L('ใช้ชื่อจริง','Use identity')}</button></div></div>`;
    const list=mentionCandidates(tok.q,ctx==='c'?top().a:null);
    if(!list.length) return `<div class="suggest"><div class="pad cap" style="padding-block:12px">${L('ไม่พบคนที่แท็กได้','No one you can mention')}</div></div>`;
    return `<div class="suggest">${list.map((x,i)=>`<button class="row" style="min-height:52px;padding:8px 16px" data-act="pickMention" data-arg="${ctx}|${x.u.user}|${x.group}|${i}">${avatar(x.u,32)}<span class="rt"><span class="lbl">${esc(x.u.name)}</span> <span class="cap">@${x.u.user}</span><br><span class="cap">${{thread:L('อยู่ในโพสต์นี้','In this thread'),interacted:L('เคยคุยกัน','You’ve interacted'),faculty:L('คณะเดียวกัน','Your faculty'),university:L('จุฬาฯ','Chula')}[x.group]}</span></span></button>`).join('')}</div>`;
  }
  const tags=TRENDING.filter(t=>t.toLowerCase().startsWith(tok.q)).slice(0,5);
  if(!tags.length) return '';
  return `<div class="suggest">${tags.map(t=>`<button class="row" style="min-height:44px;padding:8px 16px" data-act="pickTag" data-arg="${ctx}|${t}">${I('hash','sm')}<span class="rt lbl">${t}</span><span class="cap">${L('มาแรง','Trending')}</span></button>`).join('')}</div>`;
}
function replaceToken(el,tok,text){
  const v=el.value; const before=v.slice(0,tok.start); const after=v.slice(el.selectionStart);
  el.value=before+text+' '+after; const pos=(before+text+' ').length; el.focus(); el.setSelectionRange(pos,pos);
  el.dispatchEvent(new Event('input',{bubbles:true}));
}

/* ============ VIEW ROUTER ============ */
function view(){
  if(!S.done) return `<div class="screen">${vOnboarding()}</div>`;
  if(S.draft&&top().s==='compose') return vCompose();
  const t=top();
  switch(t.s){
    case 'home': return vHome();
    case 'activity': return vActivity();
    case 'profile': return vProfile(t.a);
    case 'bubble': return vBubble(t.a);
    case 'hashtag': return vHashtag(t.a);
    case 'search': return vSearch();
    case 'post': return vPost(t.a);
    case 'settings': return vSettings();
    case 'account': return vAccount();
    case 'deleteAccount': return vDeleteAccount();
    case 'privacy': return vPrivacy();
    case 'language': return vLanguage();
    case 'theme': return vTheme();
    case 'help': return vHelp();
    case 'rules': return vDoc('rules');
    case 'privacyPolicy': return vDoc('privacy');
    case 'support': return vSupport(t.a);
    case 'editProfile': return vEditProfile();
    case 'removal': return vRemoval(t.a);
    case 'shared': return vShared();
    case 'credits': return vCredits();
  }
  return vHome();
}
function fitPeek(){const sh=document.querySelector('#app .bsheet.peek'),mw=sh&&sh.closest('.mapwrap');if(!sh||!mw)return;
  const prev=sh.style.transition;sh.style.transition='none';sh.style.height='auto';const h=Math.min(sh.offsetHeight,Math.round(mw.offsetHeight*.62));sh.style.height='';sh.offsetHeight;sh.style.transition=prev;mw.style.setProperty('--peek',h+'px');}
window.addEventListener('resize',()=>{if(window.S&&S.done)fitPeek();});
function render(){
  $('#app').innerHTML=view();
  const scr=$('#app').firstElementChild; if(scr&&T.anim){scr.classList.add(T.anim);} T.anim=null;
  $('#app').querySelectorAll('.topbar .t,.h1,.uni,.display').forEach(h=>{if(h.textContent.trim()){h.setAttribute('role','heading');h.setAttribute('aria-level','1');}});
  $('#app').querySelectorAll('.h2,.section-t').forEach(h=>{h.setAttribute('role','heading');h.setAttribute('aria-level','2');});
  restoreScroll(); fitPeek();
  if(window.syncUrl) syncUrl();
  renderOverlay(); applyTheme(); renderPanel(); save();
  document.documentElement.lang=S.lang;
  if(S.done&&top().s==='compose') refreshCompose();
}
