  pfFac(el){S.me.fac=FACULTIES[+el.value].slice();pfValidate();},
  pfMajor(el){S.me.major=el.value.trim();save();},
  pfYear(el){const y=el.value;S.me.year=/^\d+$/.test(y)?+y:y;pfValidate();},
  epFac(el){T.ep=T.ep||{};T.ep.fac=FACULTIES[+el.value].slice();},
  epMajor(el){T.ep=T.ep||{};T.ep.major=el.value.trim();},
  epYear(el){T.ep=T.ep||{};const y=el.value;T.ep.year=/^\d+$/.test(y)?+y:y;},
  avatarFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>shrink(r.result,160,u=>{S.me.photo=u;render();});r.readAsDataURL(f);},
  search(el){T.search.q=el.value;clearTimeout(T.st);T.st=setTimeout(()=>runSearch(false),250);$('#searchBody').innerHTML=searchBody();},
  bpSearch(el){T.ov.q=el.value;const pos=el.selectionStart;renderOverlay();const n=$('#bpSearch');n.focus();n.setSelectionRange(pos,pos);},
  cmpText(el){
    const d=S.draft; d.text=el.value; el.style.height='auto'; el.style.height=Math.max(120,el.scrollHeight)+'px';
    if(!d.editing){const sug=suggestCat(d.text); if(sug!==d.catAuto){d.catAuto=sug; if(!d.catTouched&&sug) d.cat=sug; $('#cmpCats').innerHTML=composeCats();}}
    $('#cmpLink').innerHTML=composeLink();
    $('#cmpSuggest').innerHTML=suggestHTML(activeToken(el),d.mode,'cmp');
    refreshCompose();
  },
  cmpFiles(el){const files=[...el.files].slice(0,4-S.draft.images.length);syncDraftText();if(S.draft.poll){toast(L('โพสต์ที่มีโพลใส่รูปไม่ได้','Polls can’t be combined with photos'));return;}
    if(!files.length){toast(L('ใส่รูปได้สูงสุด 4 รูป','Up to 4 photos'));return;}
    let left=files.length;files.forEach(f=>{const r=new FileReader();r.onload=()=>shrink(r.result,900,u=>{S.draft.images.push({src:u,failed:S.sim.uploadFail});if(--left===0)render();});r.readAsDataURL(f);});},
  pollOpt(el){S.draft.poll.opts[+el.dataset.i]=el.value;refreshCompose();},
  gifQ(el){T.gifQ=el.value;const pos=el.selectionStart;renderOverlay();const n=$('#gifQ');if(n){n.focus();n.setSelectionRange(pos,pos);}},
  cInput(el){
    el.style.height='auto'; el.style.height=Math.min(120,el.scrollHeight)+'px';
    const v=el.value; const hasUrl=URL_RE.test(v); const has=v.trim().length>0||!!T.cAtt;
    $('#cSend').style.display=has?'flex':'none'; $('#cMic').style.display=has?'none':'flex';
    $('#cSend').disabled=hasUrl; $('#cSend').style.opacity=hasUrl?.35:1;
    $('#cHint').innerHTML=hasUrl?`<div class="err-t" style="padding:6px 0">${I('link','xs')} ${L('ใส่ลิงก์ในคอมเมนต์ไม่ได้','Links can’t be added to comments')}</div>`:(mentionsIn(v).length>5&&(T.cmode||S.settings.mode)!=='anon'?`<div class="err-t" style="padding:6px 0">${L('แท็กได้ไม่เกิน 5 คน','Max 5 mentions')}</div>`:'');
    $('#cSuggest').innerHTML=suggestHTML(activeToken(el),T.cmode||S.settings.mode,'c');
  },
};
function pfValidate(){const v=validUsername(S.me.user);const m=$('#pfUserMsg');if(m){m.className=v.ok?'ok-t':'err-t';m.textContent=S.me.user?v.msg:L('3–20 ตัว a–z 0–9 . _','3–20 characters: a–z 0–9 . _');}
  $('#pfUser').classList.toggle('err',!!S.me.user&&!v.ok);const b=$('#pfNext');if(b)b.disabled=!(S.me.name.trim()&&v.ok&&S.me.fac&&S.me.year);save();}
function runSearch(force){const q=T.search.q.trim();if(!q)return;const r=searchResults(q);track('search_performed',{query_length:q.length,results_tab:T.search.tab,results_count:r.posts.length+r.tags.length+r.people.length});if(force)saveRecent(q);}
function saveRecent(q){S.recent=[q].concat(S.recent.filter(x=>x!==q)).slice(0,5);}
function syncDraftText(){const t=$('#cmpText');if(t&&S.draft)S.draft.text=t.value;S.draft&&document.querySelectorAll('[data-on="pollOpt"]').forEach(i=>{S.draft.poll&&(S.draft.poll.opts[+i.dataset.i]=i.value);});}
function shrink(dataUrl,max,cb){const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8));};img.onerror=()=>cb(dataUrl);img.src=dataUrl;}

/* ============ flows ============ */
function finishOnboarding(){
  S.done=true; S.nav=[{s:'home'}]; S.tab='home'; S.home.feed='university'; S.home.firstPrompt=true;
  if(S.ob.perm.loc!=='granted') S.settings.loc=false;
  S.me.verifiedAt=Date.now();
  track('email_sent',{type:'welcome'});
  // seeded activity that involves the new user
  const c={id:uid('c'),post:'p14',by:'u1',anon:false,parent:null,replyTo:null,text:'@'+S.me.user+' ชั้น 4 ที่บอกอยู่ตรงนี้นะ มาอ่านด้วยกันได้',at:Date.now()-3*MIN,ate:2,ated:false,voice:null,mentions:['me'],removed:false};
  S.comments.push(c);
  addNotif({type:'mention',post:'p14',at:Date.now()-3*MIN,avs:['u1'],html:L('<b>ณัฐณิชา</b> พูดถึงคุณ','<b>ณัฐณิชา</b> mentioned you'),prev:c.text});
  addNotif({type:'welcome',channel:'in_app',html:L('ยินดีต้อนรับสู่ EIGHT TEEN! เราส่งอีเมลต้อนรับไปที่ '+S.me.email+' แล้ว','Welcome to EIGHT TEEN! We sent a welcome email to '+S.me.email)});
  track('feed_viewed',{feed:'university',sort:'hot',category:'all'});
  render();
}
function tagPlace(id,src){const b=bubble(id);track('place_tag_added',{bubble_id:id,source:src,is_live:isLive(b)});track('on_the_spot_checked',{bubble_id:id,result:!locOn()?'no_permission':onSpot(b)?'in':'out'});}
function openCompose(o){
  if(S.savedDraft&&!o.bubble){S.draft=S.savedDraft;S.savedDraft=null;toast(L('เปิดร่างที่เก็บไว้','Draft restored'));}
  else S.draft=newDraft(o);
  push('compose'); setTimeout(()=>{const t=$('#cmpText');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);H.cmpText(t);}},30);
}
function moderate(text){
  const t=text.toLowerCase();
  if(MOD.self.some(w=>t.includes(w))) return {level:'self'};
  const h=MOD.high.find(([w])=>t.includes(w.toLowerCase())); if(h) return {level:'high',reason:h[1]};
  if(MOD.medium.some(w=>t.includes(w))) return {level:'medium'};
  return {level:'low'};
}
function publish(){
  syncDraftText(); const d=S.draft; if(composeValid().length) return;
  if(!d.editing){const recent=S.posts.filter(p=>p.by==='me'&&Date.now()-p.at<HOUR).sort((a,b)=>a.at-b.at); if(recent.length>=10){openOv({t:'rateLimit',wait:Math.ceil((recent[0].at+HOUR-Date.now())/MIN)});return;}}
  openOv({t:'aicheck'});
  setTimeout(()=>{
    const mod=moderate(d.text);
    if(mod.level==='self'){openOv({t:'support'});track('post_blocked',{reason:'self_harm',risk_level:'high'});return;}
    if(mod.level==='high'){openOv({t:'blocked',reason:mod.reason});track('post_blocked',{reason:mod.reason,risk_level:'high'});return;}
    closeOv();
    if(d.editing){const p=S.posts.find(x=>x.id===d.editing);p.text=d.text;p.cat=d.cat;p.tags=tagsOf(d.text);p.images=d.images;p.edited=true;track('post_edited',{post_id:p.id});S.draft=null;pop();toast(L('บันทึกการแก้ไขแล้ว','Changes saved'));return;}
    const ments=d.mode==='anon'?[]:mentionsIn(d.text).map(u=>Object.values(USERS).find(x=>x.user===u)).filter(u=>u&&u.mentions!=='none'&&!isBlocked(u.id)).map(u=>u.id);
    const p={id:uid('p'),by:'me',anon:d.mode==='anon',text:d.text.trim(),cat:d.cat,uni:true,bubble:d.bubble,spot:!!(d.bubble&&onSpot(d.bubble)),images:d.images.map(i=>({src:i.src,h:i.h,alt:L('รูปที่ผู้โพสต์แนบ','Photo attached by the author')})),gif:d.gif,voice:d.voice,poll:d.poll?{opts:d.poll.opts.filter(o=>o.trim()),votes:d.poll.opts.filter(o=>o.trim()).map(()=>0),mine:null,ends:Date.now()+d.poll.days*DAY}:null,ate:0,ated:false,tags:tagsOf(d.text),mentions:ments,edited:false,removed:false,pinned:false,reach:mod.level==='medium'?'reduced':'normal',at:Date.now()};
    S.posts.unshift(p);haptic();
    track('post_created',{post_id:p.id,mode:p.anon?'anonymous':'identity',category:p.cat,has_image:p.images.length>0,has_poll:!!p.poll,has_gif:!!p.gif,has_voice:!!p.voice,hashtags_count:p.tags.length,mentions_count:ments.length,place_bubble_id:p.bubble,on_the_spot:p.spot,is_live:!!(p.bubble&&isLive(p.bubble))});
    if(mod.level==='medium') track('moderation_queued (internal)',{post_id:p.id,risk_level:'medium',reach:'reduced'});
    S.draft=null; S.savedDraft=null; S.home.firstPrompt=false; pop();
    toast(L('โพสต์แล้ว','Posted'),{act:'openPost',arg:p.id,label:L('ดูโพสต์','View')});
    setTimeout(()=>{if(!S.posts.includes(p)||p.removed)return;p.ate+=3;addNotif({type:'ate',post:p.id,avs:['u2','u1','u6'],html:L('<b>3 คน</b> ATE โพสต์ของคุณ','<b>3 people</b> gave your post ATE'),prev:p.text});render();},6000);
  },900);
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='LABEL') return;
  const fn=A[el.dataset.act]; if(!fn) return;
  e.preventDefault(); e.stopPropagation();
  fn(el.dataset.arg,el,e);
  if(el.closest('#panel')&&!['panelClose','lang','setTheme','simHere','simOffline','simUpload','resetAll','skipOnboarding'].includes(el.dataset.act))A.panelClose();
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.on&&H[el.dataset.on]&&el.type!=='file'&&el.tagName!=='SELECT')H[el.dataset.on](el,e);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.on&&H[el.dataset.on]&&(el.type==='file'||el.tagName==='SELECT'))H[el.dataset.on](el,e);});
document.addEventListener('keydown',e=>{
  if(e.target.id==='searchInput'&&e.key==='Enter'){runSearch(true);}
  if(e.target.id==='ssoEmail'&&e.key==='Enter'){e.preventDefault();A.ssoSubmit();}
  if(e.target.id==='cInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();A.sendComment();}
  if(e.key==='Escape'&&T.ov&&T.ov.t!=='aicheck')closeOv();
});
document.addEventListener('selectionchange',()=>{const a=document.activeElement;if(a&&a.id==='cmpText'&&S.draft)$('#cmpSuggest').innerHTML=suggestHTML(activeToken(a),S.draft.mode,'cmp');});
/* on-screen keyboard: shrink the app to the visible area so inputs stay visible */
(function(){const vv=window.visualViewport;if(!vv)return;const ph=$('#phone');
  const fit=()=>{if(innerWidth>520){ph.classList.remove('kb');ph.style.removeProperty('height');ph.style.removeProperty('transform');return;}
    const kb=innerHeight-vv.height>120;ph.classList.toggle('kb',kb);
    if(kb){ph.style.height=vv.height+'px';ph.style.transform=`translateY(${vv.offsetTop}px)`;}else{ph.style.removeProperty('height');ph.style.removeProperty('transform');}};
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);
  document.addEventListener('focusin',e=>{const el=e.target;if(!el.matches('input,textarea,select'))return;setTimeout(()=>{try{el.scrollIntoView({block:'nearest'});}catch(_){}} ,320);});
})();
/* swipe down on a sheet's handle to dismiss it */
(function(){let drag=null;
  document.addEventListener('pointerdown',e=>{const z=e.target.closest('#overlay .grabzone');if(!z)return;const sh=z.closest('.sheet');drag={sh,y0:e.clientY,dy:0};sh.style.transition='none';z.setPointerCapture&&z.setPointerCapture(e.pointerId);});
  document.addEventListener('pointermove',e=>{if(!drag)return;drag.dy=Math.max(0,e.clientY-drag.y0);drag.sh.style.transform=`translateY(${drag.dy}px)`;});
  const end=()=>{if(!drag)return;const {sh,dy}=drag;drag=null;sh.style.transition='transform .18s cubic-bezier(.2,.8,.2,1)';
    if(dy>80&&T.ov){sh.style.transform='translateY(100%)';setTimeout(()=>{T.ov&&T.ov.t==='sso'?A.ssoCancel():(T.ov&&(T.ov=null,renderOverlay()));},160);}else sh.style.transform='';};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
})();
/* ============ URL ROUTES: one link per screen (hash links work on GitHub Pages) ============ */
const ROUTE_PARENTS={settings:['profile'],editProfile:['profile'],account:['profile','settings'],privacy:['profile','settings'],language:['profile','settings'],theme:['profile','settings'],help:['profile','settings'],deleteAccount:['profile','settings','help'],rules:['profile','settings','help'],privacyPolicy:['profile','settings','help'],support:['profile','settings','help'],credits:['profile','settings','help'],removal:['activity']};
const ROUTE_SCREENS=['activity','bubble','hashtag','search','post','profile','settings','account','deleteAccount','privacy','language','theme','help','rules','privacyPolicy','support','editProfile','removal','shared','credits'];
const OB_STEPS=['welcome','consent','sso','dob','profile','interests','location','push'];
window.routeOf=function(){
  if(!S.done) return '/onboarding/'+(S.ob.step==='resume'?S.ob.resumeTo||'welcome':S.ob.step);
  const t=top();
  if(t.s==='compose') return '/compose';
  if(t.s==='home') return S.home.feed==='bubble'?'/home/bubble':'/home';
  if(t.s==='profile') return '/profile'+(t.a&&t.a!=='me'?'/'+t.a:'');
  return '/'+t.s+(t.a?'/'+encodeURIComponent(t.a):'');
};
window.syncUrl=function(){try{const h='#'+routeOf();if(location.hash!==h)history.replaceState(history.state,'',h);}catch(e){}};
function applyRoute(hash){
  const parts=(hash||'').replace(/^#\/?/,'').split('/').filter(Boolean).map(x=>{try{return decodeURIComponent(x);}catch(e){return x;}});
  if(!parts.length) return false;
  const s=parts[0],a=parts[1];
  T.ov=null;
  if(s==='onboarding'){if(!OB_STEPS.includes(a||'welcome'))return false;S.done=false;S.ob.step=a||'welcome';S.ob.started=S.ob.step!=='welcome';if(S.ob.step==='profile'||S.ob.step==='interests'){S.ob.consent=S.ob.consent||{terms:true,mkt:false};}track('route_opened',{route:'/'+parts.join('/')});return true;}
  const known=s==='home'||s==='compose'||ROUTE_SCREENS.includes(s);
  if(!known) return false;
  if(!S.done) A.skipOnboarding();
  S.draft=null;
  if(s==='home'){S.home.feed=a==='bubble'?'bubble':'university';S.tab='home';S.nav=[{s:'home'}];}
  else if(s==='compose'){S.tab='home';S.nav=[{s:'home'}];openCompose({src:'link'});}
  else if(s==='activity'){S.tab='activity';S.nav=[{s:'activity'}];}
  else if(s==='profile'&&(!a||a==='me')){S.tab='profile';S.nav=[{s:'profile'}];}
  else{const par=ROUTE_PARENTS[s]||['home'];S.tab=par[0];S.nav=par.map(x=>({s:x})).concat([{s,a}]);}
  track('route_opened',{route:'/'+parts.join('/')});
  return true;
}
window.addEventListener('hashchange',()=>{if(location.hash==='#'+routeOf())return;if(applyRoute(location.hash)){T.anim='tabfade';render();}});
const routedAtLoad=applyRoute(location.hash);
/* the prompt asks for a fresh feed each load */
if(!routedAtLoad&&!S.done&&S.ob.started&&S.ob.step!=='welcome'&&S.ob.step!=='resume'){S.ob.resumeTo=S.ob.step;S.ob.step='resume';}
if(S.done&&top().s==='compose'&&!S.draft) S.nav=[{s:S.tab}];
S.posts.forEach(p=>{if(!p.tags||!p.tags.length)p.tags=tagsOf(p.text);});
document.documentElement.classList.add('no-tr');
render();
requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>document.documentElement.classList.remove('no-tr'),120)));
if(!S.events.length) track('onboarding_step_viewed',{step_name:'welcome',step_index:0});
})();
</script>
